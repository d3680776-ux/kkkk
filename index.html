<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Стрелялка | 2 Оружия</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    /* Прицел */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      margin-left: -5px;
      background-color: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    /* Интерфейс (HUD) */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-item {
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Стартовый экран */
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 20;
      cursor: pointer;
    }

    #instructions {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #instructions h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    #instructions p {
      font-size: 1.1rem;
      margin: 8px 0;
      color: #cbd5e1;
    }
  </style>

  <!-- Подключаем Three.js и PointerLockControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div id="hud">
    <div class="hud-item">❤️ Здоровье: <span id="health">100</span></div>
    <div class="hud-item">💥 Счёт: <span id="score">0</span></div>
    <div class="hud-item">🔫 Оружие: <span id="weaponName">Пистолет</span></div>
    <div class="hud-item">📦 Патроны: <span id="ammo">12 / 12</span></div>
  </div>

  <div id="blocker">
    <div id="instructions">
      <h1>3D ШУТЕР</h1>
      <p>Кликни мышкой по экрану, чтобы начать игру</p>
      <br>
      <p><b>W, A, S, D</b> — Движение</p>
      <p><b>Пробел</b> — Прыжок</p>
      <p><b>1 / 2</b> — Выбор оружия (1: Пистолет, 2: Автомат)</p>
      <p><b>ЛКМ</b> — Стрелять (Автомат стреляет при зажатии!)</p>
      <p><b>R</b> — Перезарядка</p>
    </div>
  </div>

  <script>
    let camera, scene, renderer, controls;
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    // Игровые параметры
    let health = 100;
    let score = 0;

    // Конфигурации оружия
    const weapons = {
      1: {
        name: 'Пистолет',
        maxAmmo: 12,
        ammo: 12,
        reloadTime: 1500,
        fireRate: 250, // мс между выстрелами
        automatic: false,
        damage: 10
      },
      2: {
        name: 'Автомат',
        maxAmmo: 30,
        ammo: 30,
        reloadTime: 2500,
        fireRate: 100, // мс между выстрелами (высокий темп)
        automatic: true,
        damage: 10
      }
    };

    let currentWeaponId = 1;
    let isReloading = false;
    let isMouseDown = false;
    let lastShootTime = 0;

    // Враги и пули
    const enemies = [];
    const raycaster = new THREE.Raycaster();
    
    // Модели оружия
    let pistolGroup, rifleGroup;
    let pistolFlash, rifleFlash;

    init();
    animate();

    function init() {
      // 1. Сцена и камера
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.Fog(0x0f172a, 0, 75);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.y = 1.6;

      // 2. Освещение
      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
      light.position.set(0.5, 1, 0.75);
      scene.add(light);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // 3. Управление (Pointer Lock)
      controls = new THREE.PointerLockControls(camera, document.body);

      const blocker = document.getElementById('blocker');
      blocker.addEventListener('click', () => controls.lock());

      controls.addEventListener('lock', () => blocker.style.display = 'none');
      controls.addEventListener('unlock', () => blocker.style.display = 'flex');

      scene.add(controls.getObject());

      // Клавиши
      const onKeyDown = function (event) {
        switch (event.code) {
          case 'KeyW': case 'ArrowUp': moveForward = true; break;
          case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
          case 'KeyS': case 'ArrowDown': moveBackward = true; break;
          case 'KeyD': case 'ArrowRight': moveRight = true; break;
          case 'Space': if (canJump === true) velocity.y += 12; canJump = false; break;
          case 'KeyR': reload(); break;
          case 'Digit1': switchWeapon(1); break;
          case 'Digit2': switchWeapon(2); break;
        }
      };

      const onKeyUp = function (event) {
        switch (event.code) {
          case 'KeyW': case 'ArrowUp': moveForward = false; break;
          case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
          case 'KeyS': case 'ArrowDown': moveBackward = false; break;
          case 'KeyD': case 'ArrowRight': moveRight = false; break;
        }
      };

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);

      // Обработка зажатия/отпускания мыши для автомата
      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          isMouseDown = true;
          tryShoot();
        }
      });
      document.addEventListener('mouseup', (e) => {
        if (e.button === 0) isMouseDown = false;
      });

      // 4. Пол
      const floorGeometry = new THREE.PlaneGeometry(200, 200, 20, 20);
      const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const floor = new THREE.Mesh(floorGeometry, floorMaterial);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const grid = new THREE.GridHelper(200, 40, 0x38bdf8, 0x334155);
      grid.position.y = 0.01;
      scene.add(grid);

      // 5. Создание 3D моделей оружия
      createWeapons();

      // 6. Спавн врагов
      setInterval(spawnEnemy, 2500);

      // 7. Рендерер
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);
      updateHUD();
    }

    // Создание моделей 1) Пистолета и 2) Автомата
    function createWeapons() {
      // --- 1. Пистолет ---
      pistolGroup = new THREE.Group();
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x334155 });

      const pBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), gunMat);
      const pHandle = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.2, 0.1), gunMat);
      pHandle.position.set(0, -0.1, 0.1);
      pistolGroup.add(pBarrel, pHandle);

      const flashGeo = new THREE.SphereGeometry(0.08, 8, 8);
      const flashMat = new THREE.MeshBasicMaterial({ color: 0xffcb00, visible: false });
      pistolFlash = new THREE.Mesh(flashGeo, flashMat);
      pistolFlash.position.set(0, 0, -0.25);
      pistolGroup.add(pistolFlash);

      pistolGroup.position.set(0.2, -0.15, -0.4);
      camera.add(pistolGroup);

      // --- 2. Автомат ---
      rifleGroup = new THREE.Group();
      const rifleMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f });

      // Длинный ствол
      const rBarrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.8), rifleMat);
      // Магазин
      const rMag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.3, 0.12), gunMat);
      rMag.position.set(0, -0.15, -0.1);
      rMag.rotation.x = 0.3;
      // Приклад
      const rStock = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.15, 0.3), woodMat);
      rStock.position.set(0, -0.05, 0.4);

      rifleGroup.add(rBarrel, rMag, rStock);

      rifleFlash = new THREE.Mesh(flashGeo, flashMat);
      rifleFlash.position.set(0, 0, -0.45);
      rifleGroup.add(rifleFlash);

      rifleGroup.position.set(0.22, -0.18, -0.45);
      rifleGroup.visible = false; // По умолчанию скрыт
      camera.add(rifleGroup);
    }

    // Переключение оружия
    function switchWeapon(id) {
      if (currentWeaponId === id || isReloading) return;

      currentWeaponId = id;
      if (id === 1) {
        pistolGroup.visible = true;
        rifleGroup.visible = false;
      } else {
        pistolGroup.visible = false;
        rifleGroup.visible = true;
      }
      updateHUD();
    }

    // Попытка произвести выстрел
    function tryShoot() {
      if (!controls.isLocked || isReloading) return;

      const w = weapons[currentWeaponId];
      const now = performance.now();

      if (now - lastShootTime < w.fireRate) return;

      if (w.ammo <= 0) {
        reload();
        return;
      }

      w.ammo--;
      lastShootTime = now;
      updateHUD();

      // Вспышка и отдача
      const flash = currentWeaponId === 1 ? pistolFlash : rifleFlash;
      flash.material.visible = true;
      setTimeout(() => flash.material.visible = false, 40);

      camera.rotation.x += 0.015;

      // Проверка попадания
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(enemies);

      if (intersects.length > 0) {
        const hitEnemy = intersects[0].object;
        scene.remove(hitEnemy);
        enemies.splice(enemies.indexOf(hitEnemy), 1);
        score += 10;
        updateHUD();
      }
    }

    // Перезарядка
    function reload() {
      if (isReloading) return;

      const w = weapons[currentWeaponId];
      if (w.ammo === w.maxAmmo) return;

      isReloading = true;
      document.getElementById('ammo').textContent = 'Перезарядка...';

      setTimeout(() => {
        w.ammo = w.maxAmmo;
        isReloading = false;
        updateHUD();
      }, w.reloadTime);
    }

    // Спавн врагов
    function spawnEnemy() {
      if (!controls.isLocked || enemies.length >= 15) return;

      const geometry = new THREE.BoxGeometry(1.2, 2, 1.2);
      const material = new THREE.MeshStandardMaterial({ color: 0xef4444 });
      const enemy = new THREE.Mesh(geometry, material);

      const angle = Math.random() * Math.PI * 2;
      const distance = 25 + Math.random() * 15;
      
      enemy.position.x = camera.position.x + Math.cos(angle) * distance;
      enemy.position.z = camera.position.z + Math.sin(angle) * distance;
      enemy.position.y = 1;

      scene.add(enemy);
      enemies.push(enemy);
    }

    function updateHUD() {
      const w = weapons[currentWeaponId];
      document.getElementById('health').textContent = health;
      document.getElementById('score').textContent = score;
      document.getElementById('weaponName').textContent = w.name;

      if (!isReloading) {
        document.getElementById('ammo').textContent = `${w.ammo} / ${w.maxAmmo}`;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Анимационный цикл
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();

      if (controls.isLocked) {
        // Если зажата кнопка и выбрано автоматическое оружие
        if (isMouseDown && weapons[currentWeaponId].automatic) {
          tryShoot();
        }

        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;
        velocity.y -= 9.8 * 30.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        controls.getObject().position.y += (velocity.y * delta);

        if (controls.getObject().position.y < 1.6) {
          velocity.y = 0;
          controls.getObject().position.y = 1.6;
          canJump = true;
        }

        // Движение врагов к игроку
        const playerPos = controls.getObject().position;
        enemies.forEach((enemy) => {
          enemy.lookAt(playerPos.x, 1, playerPos.z);
          enemy.translateZ(3.5 * delta);

          if (enemy.position.distanceTo(playerPos) < 1.5) {
            health -= 1;
            updateHUD();
            if (health <= 0) {
              alert('Игра окончена! Твой счёт: ' + score);
              location.reload();
            }
          }
        });
      }

      prevTime = time;
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
