        const categories = [
            { id: 'all', name: 'Все мемы', icon: '🔥' },

            { id: 'reaction', name: 'Реакции', icon: '💥' },
            { id: 'games', name: 'Игры', icon: '🎮' },
            { id: 'music', name: 'Музыка', icon: '🎵' }
        ];

        let activeAudios = [];
        let currentCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('meme_ultra_favs')) || [];

        function init() {
            renderCategories();
            renderMemes();
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat.id}', this)" 
                    class="cat-btn flex items-center gap-2 bg-white/5 border border-white/10 hover:border-cyan-400/50 text-gray-300 px-4 py-2 rounded-full font-bold whitespace-nowrap transition duration-300 text-sm ${cat.id === currentCategory ? 'bg-gradient-to-r from-pink-500 to-purple-600 !text-white !border-transparent shadow-[0_0_15px_rgba(255,0,127,0.5)]' : ''}">
                    <span>${cat.icon}</span>
                    <span>${cat.name}</span>
                </button>
            `).join('');
        }

        function renderMemes() {
            const grid = document.getElementById('memeGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = memes.filter(m => {
                const matchesSearch = m.name.toLowerCase().includes(searchVal);
                const matchesCat = (currentCategory === 'all') || 
                                   (currentCategory === 'fav' && favorites.includes(m.id)) ||
                                   (m.cat === currentCategory);
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400 font-bold text-lg">
                        Ничего не найдено 😿 Попробуй изменить запрос!
                    </div>
                `;
                return;
            }

            filtered.forEach(meme => {
                const isFav = favorites.includes(meme.id);
                
                const card = document.createElement('div');
                card.className = `meme-card relative bg-gradient-to-br from-[#232042] to-[#15132a] border border-white/10 rounded-2xl p-4 flex flex-col items-center justify-between cursor-pointer aspect-square`;
                card.id = `card-${meme.id}`;
                card.onclick = () => playSound(meme);

                card.innerHTML = `
                    <button onclick="toggleFav(event, '${meme.id}')" class="absolute top-3 right-3 text-xl transition transform hover:scale-125 z-10 ${isFav ? 'text-yellow-400 drop-shadow-[0_0_8px_rgba(255,202,58,0.8)]' : 'text-white/20 hover:text-white/60'}">

                    <div class="text-4xl md:text-5xl my-auto transform transition duration-300 hover:scale-110 drop-shadow-lg">
                        ${meme.icon}
                    </div>
                    <div class="text-xs md:text-sm font-bold text-center text-white leading-tight mt-2 line-clamp-2">
                        ${meme.name}
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function playSound(meme) {
            const vol = parseFloat(document.getElementById('volumeSlider').value);
            const audio = new Audio(meme.url);
            audio.volume = vol;

            audio.play().then(() => {
                const card = document.getElementById(`card-${meme.id}`);
                if (card) card.classList.add('playing');
                showStatus(meme.name);
            }).catch(e => {
                console.warn('Ошибка загрузки или воспроизведения звука:', e);
            });

            activeAudios.push(audio);

            audio.onended = () => {
                const card = document.getElementById(`card-${meme.id}`);
                if (card) card.classList.remove('playing');
                activeAudios = activeAudios.filter(a => a !== audio);
                if (activeAudios.length === 0) hideStatus();
            };
        }

        function stopAll() {
            activeAudios.forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
            activeAudios = [];
            document.querySelectorAll('.meme-card').forEach(c => c.classList.remove('playing'));
            hideStatus();
        }

        function playRandom() {
            const randomMeme = memes[Math.floor(Math.random() * memes.length)];
            playSound(randomMeme);
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('meme_ultra_favs', JSON.stringify(favorites));
            renderMemes();
        }

        function selectCategory(catId) {
            currentCategory = catId;
            renderCategories();
            renderMemes();
        }

        function filterMemes() {
            renderMemes();
        }

        function updateVolume() {
            const slider = document.getElementById('volumeSlider');
            const vol = parseFloat(slider.value);
            document.getElementById('volumeValue').innerText = Math.round(vol * 100) + '%';
            activeAudios.forEach(a => a.volume = vol);
        }

        function showStatus(name) {
            const bar = document.getElementById('statusBar');
            document.getElementById('currentMemeName').innerText = name;
            bar.classList.remove('translate-y-32');
        }

        function hideStatus() {
            const bar = document.getElementById('statusBar');
            bar.classList.add('translate-y-32');
        }

        window.onload = init;
    </script>
</body>
</html>
