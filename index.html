<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Пойдёшь гулять?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 176, 155, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(0, 176, 155, 0.6);
    }

    .btn-no {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
      position: absolute;
      /* Начальное положение возле кнопки "Да" */
      right: 20px; 
      transition: top 0.2s ease, left 0.2s ease;
    }

    /* Модальное окно победы */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #ffffff;
      color: #222;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-content h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #2e7d32;
    }

    .modal-content p {
      font-size: 1.2rem;
      color: #555;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Пойдёшь гулять?</h1>
    <div class="buttons-container">
      <button class="btn btn-yes" onclick="acceptInvitation()">Да!</button>
      <button class="btn btn-no" id="noBtn">Нет</button>
    </div>
  </div>

  <!-- Сообщение при согласии -->
  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>Отлично! 🎉</h2>
      <p>Я знал, что ты согласишься! Собирайся, выходим! 🚀</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const winModal = document.getElementById('winModal');

    // Функция убегания кнопки "Нет"
    function moveButton() {
      // Вычисляем случайные координаты внутри экрана
      const maxX = window.innerWidth - noBtn.offsetWidth - 30;
      const maxY = window.innerHeight - noBtn.offsetHeight - 30;

      const randomX = Math.max(30, Math.floor(Math.random() * maxX));
      const randomY = Math.max(30, Math.floor(Math.random() * maxY));

      // Фиксируем позицию absolute по всему экрану
      noBtn.style.position = 'fixed';
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // Реакция на клик, касание (для телефонов) или наведение мыши
    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('touchstart', moveButton);
    noBtn.addEventListener('click', moveButton);

    // Функция при нажатии на "Да"
    function acceptInvitation() {
      winModal.style.display = 'flex';
    }
  </script>

</body>
</html>
