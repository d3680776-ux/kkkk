<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Игровой Портал | 4 в 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 20px;
    }

    header h1 {
      font-size: 2rem;
      color: #38bdf8;
    }

    /* Меню переключения игр */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 10px;
    }

    .tab-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 2px solid #334155;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .tab-btn.active, .tab-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Игровой контейнер */
    .game-container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 420px;
    }

    .game-panel {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .game-panel.active {
      display: flex;
    }

    h2 {
      margin-bottom: 15px;
      color: #38bdf8;
    }

    button.btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    button.btn:hover {
      background: #0369a1;
    }

    /* 1. Змейка */
    #snakeCanvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
    }

    /* 2. Крестики-нолики */
    .tic-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 240px;
      height: 240px;
      margin: 15px 0;
    }

    .tic-cell {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 8px;
      font-size: 2.5rem;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: #f8fafc;
    }

    /* 3. Кликер */
    .clicker-btn {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      border: 4px solid #fda4af;
      box-shadow: 0 6px 15px rgba(225, 29, 72, 0.4);
      cursor: pointer;
      margin: 20px 0;
      transition: transform 0.1s;
    }

    .clicker-btn:active {
      transform: scale(0.92);
    }

    /* 4. Угадай число */
    .guess-input {
      padding: 10px;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1.2rem;
      width: 120px;
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 Мини-игры</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchGame('snake')">🐍 Змейка</button>
    <button class="tab-btn" onclick="switchGame('ticTacToe')">❌⭕ Крестики</button>
    <button class="tab-btn" onclick="switchGame('clicker')">💥 Кликер</button>
    <button class="tab-btn" onclick="switchGame('guess')">🔢 Угадай число</button>
  </div>

  <div class="game-container">
    
    <!-- ИГРА 1: Змейка -->
    <div id="snake" class="game-panel active">
      <h2>Змейка</h2>
      <p style="margin-bottom: 10px;">Счёт: <span id="snakeScore">0</span></p>
      <canvas id="snakeCanvas" width="300" height="300"></canvas>
      <button class="btn" onclick="resetSnake()">Перезапустить</button>
    </div>

    <!-- ИГРА 2: Крестики-Нолики -->
    <div id="ticTacToe" class="game-panel">
      <h2>Крестики-Нолики</h2>
      <p id="ticStatus">Ход игрока X</p>
      <div class="tic-board" id="ticBoard"></div>
      <button class="btn" onclick="resetTic()">Сбросить игру</button>
    </div>

    <!-- ИГРА 3: Кликер -->
    <div id="clicker" class="game-panel">
      <h2>Кликер</h2>
      <p style="font-size: 1.2rem;">Кликов: <span id="clickCount">0</span></p>
      <button class="clicker-btn" onclick="addClick()">КЛИК!</button>
      <button class="btn" onclick="resetClicker()">Сбросить</button>
    </div>

    <!-- ИГРА 4: Угадай число -->
    <div id="guess" class="game-panel">
      <h2>Угадай число (1-100)</h2>
      <p id="guessHint">Загадано число от 1 до 100.</p>
      <input type="number" id="guessInput" class="guess-input" min="1" max="100" placeholder="?" />
      <button class="btn" onclick="checkGuess()">Проверить</button>
    </div>

  </div>

  <script>
    // Переключение между играми
    function switchGame(gameId) {
      document.querySelectorAll('.game-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(gameId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    /* --- 1. ЛОГИКА ЗМЕЙКИ --- */
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");
    const grid = 15;
    let snake = [{x: 150, y: 150}];
    let dx = grid, dy = 0;
    let food = {x: 60, y: 60};
    let snakeScore = 0;
    let snakeLoop;

    function gameLoopSnake() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Проверка врезания в стены
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return resetSnake();
      }

      // Проверка врезания в себя
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) return resetSnake();
      }

      snake.unshift(head);

      // Съедание еды
      if (head.x === food.x && head.y === food.y) {
        snakeScore += 10;
        document.getElementById('snakeScore').textContent = snakeScore;
        food = {
          x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
          y: Math.floor(Math.random() * (canvas.height / grid)) * grid
        };
      } else {
        snake.pop();
      }

      // Отрисовка
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ef4444";
      ctx.fillRect(food.x, food.y, grid - 2, grid - 2);

      ctx.fillStyle = "#22c55e";
      snake.forEach(segment => ctx.fillRect(segment.x, segment.y, grid - 2, grid - 2));
    }

    function resetSnake() {
      snake = [{x: 150, y: 150}];
      dx = grid; dy = 0;
      snakeScore = 0;
      document.getElementById('snakeScore').textContent = snakeScore;
    }

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowUp" && dy === 0) { dx = 0; dy = -grid; }
      if (e.key === "ArrowDown" && dy === 0) { dx = 0; dy = grid; }
      if (e.key === "ArrowLeft" && dx === 0) { dx = -grid; dy = 0; }
      if (e.key === "ArrowRight" && dx === 0) { dx = grid; dy = 0; }
    });

    setInterval(gameLoopSnake, 100);

    /* --- 2. ЛОГИКА КРЕСТИКОВ-НОЛИКОВ --- */
    let ticBoardState = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let ticActive = true;
    const ticBoard = document.getElementById("ticBoard");

    function initTic() {
      ticBoard.innerHTML = "";
      ticBoardState.forEach((val, index) => {
      const cell = document.createElement("div");
        cell.classList.add("tic-cell");
        cell.textContent = val;
        cell.addEventListener("click", () => handleTicClick(index));
        ticBoard.appendChild(cell);
      });
    }

    function handleTicClick(index) {
      if (ticBoardState[index] !== "" || !ticActive) return;
      ticBoardState[index] = currentPlayer;
      checkTicWinner();
      if (ticActive) {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        document.getElementById("ticStatus").textContent = `Ход игрока ${currentPlayer}`;
      }
      initTic();
    }

    function checkTicWinner() {
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for (let win of wins) {
        let [a, b, c] = win;
        if (ticBoardState[a] && ticBoardState[a] === ticBoardState[b] && ticBoardState[a] === ticBoardState[c]) {
          document.getElementById("ticStatus").textContent = `Победил ${ticBoardState[a]}! 🎉`;
          ticActive = false;
          return;
        }
      }
      if (!ticBoardState.includes("")) {
        document.getElementById("ticStatus").textContent = "Ничья! 🤝";
        ticActive = false;
      }
    }

    function resetTic() {
      ticBoardState = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      ticActive = true;
      document.getElementById("ticStatus").textContent = "Ход игрока X";
      initTic();
    }
    initTic();

    /* --- 3. ЛОГИКА КЛИКЕРА --- */
    let clicks = 0;
    function addClick() {
      clicks++;
      document.getElementById('clickCount').textContent = clicks;
    }
    function resetClicker() {
      clicks = 0;
      document.getElementById('clickCount').textContent = clicks;
    }

    /* --- 4. ЛОГИКА УГАДАЙ ЧИСЛО --- */
    let targetNumber = Math.floor(Math.random() * 100) + 1;
    function checkGuess() {
      const input = parseInt(document.getElementById('guessInput').value);
      const hint = document.getElementById('guessHint');
      
      if (!input) return;
      if (input === targetNumber) {
        hint.textContent = `🎯 Браво! Загаданное число: ${targetNumber}!`;
        hint.style.color = '#22c55e';
      } else if (input < targetNumber) {
        hint.textContent = "Загаданное число БОЛЬШЕ ⬆️";
        hint.style.color = '#f59e0b';
      } else {
        hint.textContent = "Загаданное число МЕНЬШЕ ⬇️";
        hint.style.color = '#f59e0b';
      }
    }
  </script>

</body>
</html>
