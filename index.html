<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Игра: Собери кристаллы</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 16px;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="ui">Счет: <span id="score">0</span></div>
    <div id="instructions">Управление: Клавиши **W, A, S, D** — движение | **Пробел** — прыжок</div>

    <!-- Подключаем Three.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // 1. Инициализация сцены, камеры и рендерера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. Создание мира (Платформа)
        const planeGeo = new THREE.PlaneGeometry(100, 100);
        const planeMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.8 });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // Декоративная сетка на полу
        const grid = new THREE.GridHelper(100, 50, 0x0f3460, 0x0f3460);
        grid.position.y = 0.01;
        scene.add(grid);

        // 4. Игрок
        const playerGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xe94560, roughness: 0.3 });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.75, 0);
        player.castShadow = true;
        scene.add(player);

        // 5. Создание кристаллов для сбора
        const crystals = [];
        const crystalGeo = new THREE.OctahedronGeometry(0.7);
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0x00fff5, roughness: 0.2, emissive: 0x005555 });

        function spawnCrystal() {
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80;
            crystal.position.set(x, 0.8, z);
            crystal.castShadow = true;
            scene.add(crystal);
            crystals.push(crystal);
        }

        // Спавним 15 кристаллов на карте
        for (let i = 0; i < 15; i++) {
            spawnCrystal();
        }

        // 6. Управление с клавиатуры
        const keys = { w: false, a: false, s: false, d: false, space: false };
        
        window.addEventListener('keydown', (e) => {
        if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = true;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if (e.code === 'Space') {
                if (isGrounded) {
                    velocityY = 0.3;
                    isGrounded = false;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
        });

        // Физика игрока
        const speed = 0.2;
        let velocityY = 0;
        const gravity = 0.015;
        let isGrounded = true;
        let score = 0;

        // 7. Игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            // Движение игрока
            if (keys.w) player.position.z -= speed;
            if (keys.s) player.position.z += speed;
            if (keys.a) player.position.x -= speed;
            if (keys.d) player.position.x += speed;

            // Ограничение движения в пределах поля (-48 до 48)
            player.position.x = Math.max(-48, Math.min(48, player.position.x));
            player.position.z = Math.max(-48, Math.min(48, player.position.z));

            // Гравитация и прыжки
            velocityY -= gravity;
            player.position.y += velocityY;

            if (player.position.y <= 0.75) {
                player.position.y = 0.75;
                velocityY = 0;
                isGrounded = true;
            }

            // Вращение и проверка сбора кристаллов
            crystals.forEach((crystal, index) => {
                crystal.rotation.y += 0.03;
                crystal.rotation.x += 0.02;

                // Проверка столкновения игрока с кристаллом (простая дистанция)
                const distance = player.position.distanceTo(crystal.position);
                if (distance < 1.5) {
                    scene.remove(crystal);
                    crystals.splice(index, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;

                    // Спавним новый кристалл взамен собранного
                    spawnCrystal();
                }
            });

            // Плавное следование камеры за игроком
            camera.position.x = player.position.x;
            camera.position.y = player.position.y + 12;
            camera.position.z = player.position.z + 15;
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        animate();

        // Адаптация при изменении размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
