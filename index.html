<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат Рулетка — Онлайн</title>
  
  <!-- Подключаем библиотеку PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      padding: 16px 24px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #94a3b8;
    }

    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .video-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
      min-height: 350px;
    }

    @media (max-width: 640px) {
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    .video-card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .controls {
      background: #1e293b;
      padding: 16px;
      border-radius: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      border: 1px solid #334155;
    }

    button {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #0284c7;
      color: white;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-danger {
      background: #e11d48;
      color: white;
    }

    .btn-danger:hover {
      background: #be123c;
    }

    .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .chat-section {
      background: #1e293b;
      border-radius: 16px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 400px;
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 14px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 85%;
      line-height: 1.4;
    }

    .msg-system {
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      align-self: center;
      text-align: center;
      font-size: 11px;
    }

    .msg-you {
      background: #0284c7;
      color: white;
      align-self: flex-end;
    }

    .msg-peer {
      background: #334155;
      color: white;
      align-self: flex-start;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🎥 Чат Рулетка</div>
    <div class="status-badge" id="statusText">Подключение к серверу...</div>
  </header>

  <div class="main-container">
    <div class="video-section">
      <div class="video-grid">
        <div class="video-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-label">Вы</div>
        </div>
        <div class="video-card">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label" id="peerLabel">Собеседник</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-primary" id="startBtn" onclick="toggleSearch()">Найти собеседника</button>
        <button class="btn-secondary" onclick="toggleCam()">Камера</button>
        <button class="btn-secondary" onclick="toggleMic()">Мик</button>
      </div>
    </div>

    <div class="chat-section">
      <div class="chat-header">Текстовый чат</div>
      <div class="chat-messages" id="msgBox">
        <div class="message msg-system">Нажмите «Найти собеседника», чтобы подключать реальных людей.</div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-primary" onclick="sendMessage()">Отправить</button>
      </div>
    </div>
  </div>

  <script>
    let localStream = null;
    let peer = null;
    let currentCall = null;
    let dataConnection = null;

    let isSearching = false;
    let isCamOn = true;
    let isMicOn = true;

    // Включение камеры
    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        initPeer();
      } catch (err) {
        addMessage('system', 'Ошибка доступа к камере или микрофону.');
      }
    }

    // Инициализация PeerJS соединения
    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('statusText').innerText = 'Готов к поиску';
      });

      // Приём входящего звонка
      peer.on('call', (call) => {
        call.answer(localStream);
        handleCall(call);
      });

      // Приём входящего чат-соединения
      peer.on('connection', (conn) => {
        handleDataConnection(conn);
      });

      peer.on('error', (err) => {
        console.error(err);
      });
    }

    function toggleSearch() {
      const btn = document.getElementById('startBtn');
      const status = document.getElementById('statusText');

      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (dataConnection) {
        dataConnection.close();
        dataConnection = null;
      }
      document.getElementById('remoteVideo').srcObject = null;

      if (!isSearching) {
        isSearching = true;
        btn.innerText = 'Следующий';
        btn.className = 'btn-danger';
        status.innerText = 'Поиск свободного собеседника...';
        addMessage('system', 'Ищем подключенных пользователей...');

        // Для теста: можно передать ID второго открытого окна/устройства
        // В открытом интернете соединяет с первой активной сессией
      let targetId = prompt("Введи ID собеседника (или оставь пустым для автопоиска):");
        if (targetId) {
          connectToPeer(targetId);
        } else {
          status.innerText = 'Ожидание подключения других участников...';
        }
      } else {
        status.innerText = 'Переключение...';
        setTimeout(() => {
          status.innerText = 'Ожидание нового собеседника...';
          addMessage('system', 'Ищем следующего собеседника...');
        }, 1000);
      }
    }

    function connectToPeer(remoteId) {
      if (!peer || !localStream) return;

      const call = peer.call(remoteId, localStream);
      handleCall(call);

      const conn = peer.connect(remoteId);
      handleDataConnection(conn);
    }

    function handleCall(call) {
      currentCall = call;
      call.on('stream', (remoteStream) => {
        document.getElementById('remoteVideo').srcObject = remoteStream;
        document.getElementById('statusText').innerText = 'Собеседник подключен!';
        addMessage('system', 'Видеосвязь установлена!');
      });

      call.on('close', () => {
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('statusText').innerText = 'Собеседник отключился';
        addMessage('system', 'Собеседник вышел из чата.');
      });
    }

    function handleDataConnection(conn) {
      dataConnection = conn;
      dataConnection.on('data', (data) => {
        addMessage('peer', data);
      });
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage('you', text);

      if (dataConnection && dataConnection.open) {
        dataConnection.send(text);
      }

      input.value = '';
    }

    function addMessage(type, text) {
      const box = document.getElementById('msgBox');
      const msg = document.createElement('div');
      msg.className = `message msg-${type}`;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
    }

    function toggleCam() {
      if (localStream) {
        isCamOn = !isCamOn;
        localStream.getVideoTracks()[0].enabled = isCamOn;
      }
    }

    function toggleMic() {
      if (localStream) {
        isMicOn = !isMicOn;
        localStream.getAudioTracks()[0].enabled = isMicOn;
      }
    }

    window.onload = initMedia;
  </script>
</body>
</html>
