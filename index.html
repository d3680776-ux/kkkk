<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Мем-Дека 5.0 — С Картинками</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e0538 0%, #0c0826 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff007f, #7928ca, #00dfd8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 20px rgba(121, 40, 202, 0.5);
            margin-bottom: 8px;
        }

        p {
            color: #b3a0d6;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Панель управления */
        .controls {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .search-box {
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #7928ca;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: #ff007f;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .action-btns {
            display: flex;
            gap: 12px;
        }

        .ctrl-btn {
            background: #2a2a40;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 12px;
            box-shadow: 0 5px 0 #151525;
            transition: all 0.1s ease;
        }

        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #151525;
        }

        .ctrl-btn-stop {
            background: #ff2a5f;
            box-shadow: 0 5px 0 #b3002d;
        }
        .ctrl-btn-stop:active {
            box-shadow: 0 1px 0 #b3002d;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 12px;
        }

        /* Категории */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        /* Сетка мемов */
        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            padding-bottom: 80px;
        }

        /* 3D Кнопки Мемов */
        .meme-card {
            background: linear-gradient(180deg, #3a3a5a 0%, #25253e 100%);
            border-radius: 16px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
            
            box-shadow: 0 8px 0 #181828, 0 15px 20px rgba(0, 0, 0, 0.4);
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.2s;
        }

        .meme-card:hover {
            background: linear-gradient(180deg, #45456c 0%, #2d2d4a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #181828, 0 20px 25px rgba(0, 0, 0, 0.5);
        }

        .meme-card:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #181828, 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .meme-card.playing {
            background: linear-gradient(180deg, #ff007f 0%, #7928ca 100%) !important;
            box-shadow: 0 0 25px #ff007f, 0 4px 0 #4a0028 !important;
            transform: translateY(4px);
            animation: pulse 0.6s infinite alternate;
        }

        @keyframes pulse {
            from { box-shadow: 0 0 15px #ff007f, 0 4px 0 #4a0028; }
            to { box-shadow: 0 0 30px #00dfd8, 0 4px 0 #4a0028; }
        }

        /* Картинка мема */
        .meme-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .meme-title {
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .fav-star {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: color 0.2s;
            z-index: 2;
        }

        .fav-star.active {
            color: #ffca3a;
            text-shadow: 0 0 10px #ffca3a;
        }

        /* Нижний статус-бар */
        .status-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #ff007f;
            color: #fff;
            padding: 12px 25px;
            border-radius: 30px;
            font-weight: bold;
            display: none;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🖼️ 3D МЕМ-ДЕКА 5.0</h1>
            <p>Жми на 3D кнопки с картинками и запускай мемы!</p>
        </header>

        <!-- Панель управления -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Найти мем..." oninput="filterMemes()">
            </div>
            
            <div class="volume-control">
                🔊 <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8" onchange="updateVolume()">
            </div>

            <div class="action-btns">
                <button class="ctrl-btn" onclick="playRandom()">🎲 Рандом</button>
                <button class="ctrl-btn ctrl-btn-stop" onclick="stopAll()">🛑 СТОП</button>
            </div>
        </div>

        <!-- Категории -->
        <div class="categories" id="categoriesContainer">
            <button class="cat-btn active" onclick="selectCategory('all', this)">Все мемы</button>
            <button class="cat-btn" onclick="selectCategory('fav', this)">⭐ Избранное</button>
            <button class="cat-btn" onclick="selectCategory('ru', this)">🇷🇺 Русские мемы</button>
            <button class="cat-btn" onclick="selectCategory('reaction', this)">💥 Реакции</button>
            <button class="cat-btn" onclick="selectCategory('games', this)">🎮 Игры</button>
            <button class="cat-btn" onclick="selectCategory('music', this)">🎵 Музыка</button>
        </div>

        <!-- Сетка 3D кнопок -->
        <div class="meme-grid" id="memeGrid"></div>
    </div>

    <!-- Индикатор игры -->
    <div class="status-bar" id="statusBar">▶ Играет: <span id="currentMemeName"></span></div>

    <script>
        // База данных мемов с ссылками на изображения
        const memes = [
            { id: 'golda', name: 'ГОЛДА!', img: 'https://images.unsplash.com/photo-1610375461246-83df859d849d?auto=format&fit=crop&w=200&q=80', cat: 'ru', url: 'https://www.myinstants.com/media/sounds/golda.mp3' },
            { id: 'koch', name: 'Коч, братан!', img: 'https://images.unsplash.com/photo-1543610892-0b1f7e6d8ac1?auto=format&fit=crop&w=200&q=80', cat: 'ru', url: 'https://www.myinstants.com/media/sounds/koch-bratan.mp3' },
            { id: 'chinazes', name: 'Чиназес!', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=200&q=80', cat: 'ru', url: 'https://www.myinstants.com/media/sounds/chinazes.mp3' },
            { id: 'a4', name: 'Влад А4!', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=200&q=80', cat: 'ru', url: 'https://www.myinstants.com/media/sounds/a4-vlad.mp3' },
            { id: 'boss', name: 'Эй, Босс!', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80', cat: 'ru', url: 'https://www.myinstants.com/media/sounds/hey-boss.mp3' },
            { id: 'sigma', name: 'Sigma Song', img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=200&q=80', cat: 'music', url: 'https://www.myinstants.com/media/sounds/sigma-grindset.mp3' },
            { id: 'mewing', name: 'Bye Bye (Mewing)', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/bye-bye-mewing.mp3' },
            { id: 'bruh', name: 'BRUH', img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/bruh-sound-effect-sound-button.mp3' },
            { id: 'emotional', name: 'Emotional Damage', img: 'https://images.unsplash.com/photo-1594322436404-5a0526db4d13?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/emotional-damage-meme.mp3' },
            { id: 'pipe', name: 'Металл. Труба', img: 'https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/metal-pipe-clang.mp3' },
            { id: 'fbi', name: 'FBI Open Up!', img: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/fbi-open-up_s1.mp3' },
            { id: 'vine_boom', name: 'Vine Boom', img: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/vine-boom.mp3' },
            { id: 'badumtss', name: 'Ba-Dum-Tss', img: 'https://images.unsplash.com/photo-1519892300165-cb5542fb47c7?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/ba-dum-tss.mp3' },
            { id: 'huh', name: 'Huh? Кот', img: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/huh-cat.mp3' },
            { id: 'quack', name: 'Кряк', img: 'https://images.unsplash.com/photo-1555852095-64e7428df0fa?auto=format&fit=crop&w=200&q=80', cat: 'reaction', url: 'https://www.myinstants.com/media/sounds/quack.mp3' },
            { id: 'oof', name: 'Roblox Oof', img: 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?auto=format&fit=crop&w=200&q=80', cat: 'games', url: 'https://www.myinstants.com/media/sounds/roblox-off.mp3' },
            { id: 'win_error', name: 'Windows Error', img: 'https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=200&q=80', cat: 'games', url: 'https://www.myinstants.com/media/sounds/windows-error.mp3' },
            { id: 'amongus', name: 'Among Us Report', img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?auto=format&fit=crop&w=200&q=80', cat: 'games', url: 'https://www.myinstants.com/media/sounds/emergency-meeting-among-us.mp3' },
            { id: 'gta_wasted', name: 'GTA Wasted', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=200&q=80', cat: 'games', url: 'https://www.myinstants.com/media/sounds/gta-v-wasted-sound-effect.mp3' },
            { id: 'airhorn', name: 'MLG Airhorn', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=200&q=80', cat: 'music', url: 'https://www.myinstants.com/media/sounds/mlg-airhorn.mp3' },
            { id: 'coffin', name: 'Coffin Dance', img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=200&q=80', cat: 'music', url: 'https://www.myinstants.com/media/sounds/coffin-dance-official-music-video-hd.mp3' }
        ];

        let activeAudios = [];
        let currentCategory = 'all';
        let favorites = JSON.parse(localStorage.getItem('meme_favs_v3')) || [];

        function init() {
            renderMemes();
        }

        function renderMemes() {
            const grid = document.getElementById('memeGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = memes.filter(m => {
                const matchesSearch = m.name.toLowerCase().includes(searchVal);
                const matchesCat = (currentCategory === 'all') || 
                                   (currentCategory === 'fav' && favorites.includes(m.id)) ||
                                   (m.cat === currentCategory);
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; font-size: 1.2rem; color: #888;">Мемы не найдены 😿</p>';
                return;
            }

            filtered.forEach(meme => {
                const isFav = favorites.includes(meme.id);
                const card = document.createElement('div');
                card.className = 'meme-card';
                card.id = `card-${meme.id}`;
                card.onclick = () => playSound(meme);

                card.innerHTML = `
                    <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${meme.id}')">★</span>
                    <img class="meme-img" src="${meme.img}" alt="${meme.name}">
                    <div class="meme-title">${meme.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playSound(meme) {
        const vol = parseFloat(document.getElementById('volumeSlider').value);
            const audio = new Audio(meme.url);
            audio.volume = vol;

            audio.play().then(() => {
                const card = document.getElementById(`card-${meme.id}`);
                if (card) card.classList.add('playing');
                showStatus(meme.name);
            }).catch(e => {
                console.warn('Ошибка аудио:', e);
            });

            activeAudios.push(audio);

            audio.onended = () => {
                const card = document.getElementById(`card-${meme.id}`);
                if (card) card.classList.remove('playing');
                activeAudios = activeAudios.filter(a => a !== audio);
                if (activeAudios.length === 0) hideStatus();
            };
        }

        function stopAll() {
            activeAudios.forEach(a => {
                a.pause();
                a.currentTime = 0;
            });
            activeAudios = [];
            document.querySelectorAll('.meme-card').forEach(c => c.classList.remove('playing'));
            hideStatus();
        }

        function playRandom() {
            const randomMeme = memes[Math.floor(Math.random() * memes.length)];
            playSound(randomMeme);
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('meme_favs_v3', JSON.stringify(favorites));
            renderMemes();
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMemes();
        }

        function filterMemes() {
            renderMemes();
        }

        function updateVolume() {
            const vol = parseFloat(document.getElementById('volumeSlider').value);
            activeAudios.forEach(a => a.volume = vol);
        }

        function showStatus(name) {
            const bar = document.getElementById('statusBar');
            document.getElementById('currentMemeName').innerText = name;
            bar.style.display = 'block';
        }

        function hideStatus() {
            document.getElementById('statusBar').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
