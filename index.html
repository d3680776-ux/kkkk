<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Telegram — Объёмный Мессенджер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
    }

    #canvas3d {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .hud-top {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .glass-pill {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .cam-btn {
      background: rgba(51, 144, 236, 0.24);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(51, 144, 236, 0.55);
      color: #bae6fd;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .cam-btn:hover { background: rgba(51, 144, 236, 0.42); }
    .cam-btn.active {
      background: #3390ec;
      color: #ffffff;
      border-color: #60a5fa;
    }

    .messenger-dock {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: min(430px, calc(100vw - 32px));
      height: min(560px, calc(100vh - 82px));
      z-index: 12;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(125, 211, 252, 0.25);
      border-radius: 22px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: height 0.18s ease-out;
    }
    .messenger-dock.minimized {
      height: 58px;
    }

    .dock-header {
      padding: 11px 14px;
      background: linear-gradient(90deg, rgba(29, 142, 201, 0.85), rgba(51, 144, 236, 0.85));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .dock-title {
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dock-actions {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn:hover { background: rgba(15, 23, 42, 0.55); }

    .room-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(2, 6, 23, 0.45);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .room-tab {
      flex: 1;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .room-tab.active {
      background: #3390ec;
      color: #ffffff;
      border-color: #60a5fa;
    }

    .name-row {
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(15, 23, 42, 0.5);
    }
    .name-row input {
      width: 145px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 4px 8px;
      color: #f8fafc;
      font-size: 12.5px;
      outline: none;
    }
    .name-row input:focus { border-color: #3390ec; }

    .msg-stream {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-card {
      max-width: 84%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.38;
      word-break: break-word;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    }
    .msg-card.in {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: #f1f5f9;
      border-bottom-left-radius: 4px;
    }
    .msg-card.out {
      align-self: flex-end;
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }
    .msg-meta {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .msg-time {
      font-weight: 400;
      font-size: 10.5px;
      opacity: 0.78;
    }

    .send-form {
      padding: 9px 10px;
      background: rgba(2, 6, 23, 0.75);
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .send-input {
      flex: 1;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 18px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      min-width: 0;
    }
    .send-input:focus { border-color: #38bdf8; }
    .send-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #3390ec;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .send-circle:hover { background: #2578cc; }

    @media (max-width: 640px) {
      .messenger-dock {
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        height: min(440px, calc(100vh - 115px));
      }
      .hud-top { top: 8px; left: 8px; right: 8px; }
    }
  </style>
</head>
<body>
  <canvas id="canvas3d"></canvas>

  <div class="hud-top">
    <div class="hud-group">
      <div class="glass-pill">🧊 3D Telegram</div>
      <div class="glass-pill" id="cloudBadge">подключение...</div>
      <div class="glass-pill" id="visBadge">👀 0</div>
    </div>
    <div class="hud-group">
      <button type="button" class="cam-btn active" id="camOrbitBtn" onclick="setCamMode('orbit')">Орбита</button>
      <button type="button" class="cam-btn" id="camFollowBtn" onclick="setCamMode('follow')">За кубами</button>
      <button type="button" class="cam-btn" onclick="resetCamera()">Центр</button>
    </div>
  </div>

  <section class="messenger-dock" id="dock">
    <div class="dock-header" onclick="toggleDock()">
      <div class="dock-title">✈️ 3D Чат <span style="font-size:11px; font-weight:600; opacity:0.9;" id="dockStatus">запуск...</span></div>
      <div class="dock-actions" onclick="event.stopPropagation()">
        <button type="button" class="mini-btn" onclick="clearCurrentRoom()">Очистить</button>
        <button type="button" class="mini-btn" onclick="toggleDock()">—</button>
      </div>
    </div>

    <div class="room-tabs">
      <button type="button" class="room-tab active" data-r="general" onclick="switchRoom('general')">💬 Общий</button>
      <button type="button" class="room-tab" data-r="saved" onclick="switchRoom('saved')">🔖 Избранное</button>
      <button type="button" class="room-tab" data-r="friends" onclick="switchRoom('friends')">👥 Друзья</button>
    </div>

    <div class="name-row">
      <span>Имя:</span>
      <input id="nickInput" type="text" placeholder="Дима" maxlength="24" onchange="saveNick()" />
      <span style="margin-left:auto; font-size:11px;" id="syncNote">Тяни мышкой фон 3D</span>
    </div>

    <div class="msg-stream" id="msgStream"></div>

    <form class="send-form" onsubmit="return onSend(event)">
      <input
        class="send-input"
        id="chatInput"
        type="text"
        autocomplete="off"
        placeholder="Написать сообщение в 3D..."
        maxlength="400"
      />
      <button type="submit" class="send-circle" title="Отправить">➤</button>
    </form>
  </section>

  <script>
    // Твой новый личный бин (Yours): https://api.npoint.io/ebd8e7a181505cd2c08b
    const API_URL = "https://api.npoint.io/ebd8e7a181505cd2c08b";
    const LS_MSGS = "tg_3d_msgs_v3";
    const LS_VIS = "tg_3d_vis_v3";
    const LS_NICK = "tg_3d_nick_v3";
    const SS_VISIT = "tg_3d_visit_v3";
    const CHAN_NAME = "tg_3d_messenger_channel_v3";

    const ROOM_NAMES = {
      general: "Общий",
      saved: "Избранное",
      friends: "Друзья"
    };

    let currentRoom = "general";
    let messages = [];
    let visitors = [];
    let camMode = "orbit";
    let cloudAvailable = false;

    const bc = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel(CHAN_NAME) : null;
    if (bc) {
      bc.onmessage = (ev) => {
        if (!ev || !ev.data) return;
        if (Array.isArray(ev.data.messages)) messages = ev.data.messages;
        if (Array.isArray(ev.data.visitors)) visitors = ev.data.visitors;
        renderUI();
      };
    }

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u && u.first_name && !localStorage.getItem(LS_NICK)) {
          localStorage.setItem(LS_NICK, u.first_name);
        }
      } catch (_) {}
    }

    // ==================== THREE.JS 3D СЦЕНА ====================
    const canvas = document.getElementById("canvas3d");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x090d16, 0.024);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 150);
    camera.position.set(0, 4.5, 14);

    const ambient = new THREE.AmbientLight(0x93c5fd, 0.9);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(8, 14, 10);
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x3390ec, 2.5, 35);
    rimLight.position.set(-8, 5, -6);
    scene.add(rimLight);

    const mintLight = new THREE.PointLight(0x22c55e, 1.8, 28);
    mintLight.position.set(7, 3, -5);
    scene.add(mintLight);

    const gridHelper = new THREE.GridHelper(36, 36, 0x3390ec, 0x1e293b);
    gridHelper.position.y = -4.5;
    scene.add(gridHelper);

    const outerRing = new THREE.Mesh(
      new THREE.TorusGeometry(6.8, 0.04, 16, 100),
      new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 })
    );
    outerRing.rotation.x = Math.PI / 2.4;
    scene.add(outerRing);

    const innerRing = new THREE.Mesh(
      new THREE.TorusGeometry(4.3, 0.03, 12, 80),
      new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.3 })
    );
    innerRing.rotation.x = Math.PI / 3;
    scene.add(innerRing);

    const starCount = 420;
    const starPositions = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 44;
      starPositions[i + 1] = (Math.random() - 0.5) * 26;
      starPositions[i + 2] = (Math.random() - 0.5) * 44;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
    const starPoints = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({ color: 0xbae6fd, size: 0.14, transparent: true, opacity: 0.75 })
    );
    scene.add(starPoints);

    const msgCubesGroup = new THREE.Group();
    scene.add(msgCubesGroup);

    function createMessageTexture(author, text, isMine) {
      const c = document.createElement("canvas");
      c.width = 512;
      c.height = 256;
      const ctx = c.getContext("2d");

      ctx.fillStyle = isMine ? "#14532d" : "#0f172a";
      ctx.fillRect(0, 0, c.width, c.height);

      ctx.strokeStyle = isMine ? "#4ade80" : "#38bdf8";
      ctx.lineWidth = 8;
      ctx.strokeRect(10, 10, c.width - 20, c.height - 20);

      ctx.fillStyle = isMine ? "#86efac" : "#7dd3fc";
      ctx.font = "bold 28px Arial, sans-serif";
      ctx.fillText(String(author || "Участник").slice(0, 22), 28, 56);

      ctx.fillStyle = "#ffffff";
      ctx.font = "26px Arial, sans-serif";
      const words = String(text || "").split(" ");
      let line = "";
      let y = 104;
      for (let i = 0; i < words.length; i++) {
        const test = line + words[i] + " ";
        if (ctx.measureText(test).width > c.width - 56 && line !== "") {
          ctx.fillText(line.trim(), 28, y);
          line = words[i] + " ";
          y += 38;
          if (y > 215) break;
        } else {
          line = test;
        }
      }
      if (y <= 215 && line.trim()) {
        ctx.fillText(line.trim(), 28, y);
      }

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    function rebuild3DMessages() {
      while (msgCubesGroup.children.length > 0) {
        const obj = msgCubesGroup.children.pop();
        if (obj.geometry) obj.geometry.dispose();
      }

      const me = getNick();
      const filtered = messages.filter((m) => (m.room || m.chat || "general") === currentRoom).slice(-14);

      filtered.forEach((m, idx) => {
        const author = m.author || m.name || "Участник";
        const text = m.text || "";
        const isMine = author.toLowerCase() === me.toLowerCase() || currentRoom === "saved";

        const angle = (idx / Math.max(filtered.length, 1)) * Math.PI * 2;
        const radius = 3.2 + (idx % 3) * 1.45;
        const y = ((idx % 4) - 1.5) * 1.35;

        const tex = createMessageTexture(author, text, isMine);
        const sideMat = new THREE.MeshStandardMaterial({
          color: isMine ? 0x22c55e : 0x3390ec,
          roughness: 0.35,
          metalness: 0.25
        });
        const faceMat = new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 0.3,
          metalness: 0.1
        });

        const materials = [sideMat, sideMat, sideMat, sideMat, faceMat, faceMat];
        const geo = new THREE.BoxGeometry(2.6, 1.35, 0.38);
        const cube = new THREE.Mesh(geo, materials);

        cube.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
        cube.lookAt(0, y, 0);
        cube.userData = {
          baseAngle: angle,
          radius: radius,
          baseY: y,
          speed: 0.004 + (idx % 3) * 0.0015,
          phase: idx * 0.9
        };
        msgCubesGroup.add(cube);
      });
    }

    let isDragging = false;
    let prevX = 0;
    let prevY = 0;
    let yaw = 0;
    let pitch = 0.25;
    let camDist = 13.5;

    canvas.addEventListener("pointerdown", (e) => {
      isDragging = true;
      prevX = e.clientX;
      prevY = e.clientY;
    });
    window.addEventListener("pointerup", () => { isDragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - prevX;
      const dy = e.clientY - prevY;
      prevX = e.clientX;
      prevY = e.clientY;
      yaw -= dx * 0.007;
      pitch = Math.max(-0.65, Math.min(1.15, pitch + dy * 0.006));
    });
    canvas.addEventListener("wheel", (e) => {
      camDist = Math.max(6.5, Math.min(24, camDist + e.deltaY * 0.008));
    }, { passive: true });

    function setCamMode(mode) {
      camMode = mode;
      document.getElementById("camOrbitBtn").classList.toggle("active", mode === "orbit");
      document.getElementById("camFollowBtn").classList.toggle("active", mode === "follow");
    }

    function resetCamera() {
      yaw = 0;
      pitch = 0.25;
      camDist = 13.5;
    }

    let clockT = 0;
    function animate3D() {
      requestAnimationFrame(animate3D);
      clockT += 0.016;

      outerRing.rotation.z += 0.0025;
      innerRing.rotation.z -= 0.0035;
      starPoints.rotation.y += 0.0006;

      msgCubesGroup.children.forEach((cube) => {
        const d = cube.userData;
        d.baseAngle += d.speed;
        cube.position.x = Math.cos(d.baseAngle) * d.radius;
        cube.position.z = Math.sin(d.baseAngle) * d.radius;
        cube.position.y = d.baseY + Math.sin(clockT * 2 + d.phase) * 0.22;
        cube.lookAt(0, cube.position.y, 0);
      });

      if (camMode === "follow" && msgCubesGroup.children.length > 0) {
        const targetCube = msgCubesGroup.children[msgCubesGroup.children.length - 1];
        camera.position.lerp(
          new THREE.Vector3(
            targetCube.position.x * 1.45,
            targetCube.position.y + 1.8,
            targetCube.position.z * 1.45 + 4.5
          ),
          0.04
        );
        camera.lookAt(targetCube.position);
      } else {
        const x = Math.sin(yaw) * Math.cos(pitch) * camDist;
        const y = Math.sin(pitch) * camDist;
        const z = Math.cos(yaw) * Math.cos(pitch) * camDist;
        camera.position.lerp(new THREE.Vector3(x, y, z), 0.08);
        camera.lookAt(0, 0, 0);
      }

      renderer.render(scene, camera);
    }
    animate3D();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== ХРАНЕНИЕ И СИНХРОНИЗАЦИЯ ====================
    function getNick() {
      const v = (document.getElementById("nickInput").value || "").trim();
      return v || "Дима";
    }

    function saveNick() {
      const v = (document.getElementById("nickInput").value || "").trim();
      if (v) localStorage.setItem(LS_NICK, v);
      renderUI();
    }

    function nowHM() {
      return new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }

    function nowFull() {
      return new Date().toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function readLocal() {
      let localMsgs = [];
      let localVis = [];
      try { localMsgs = JSON.parse(localStorage.getItem(LS_MSGS) || "[]"); } catch (_) {}
      try { localVis = JSON.parse(localStorage.getItem(LS_VIS) || "[]"); } catch (_) {}
      return {
        messages: Array.isArray(localMsgs) ? localMsgs : [],
        visitors: Array.isArray(localVis) ? localVis : []
      };
    }

    function writeLocal(msgs, vis) {
      try { localStorage.setItem(LS_MSGS, JSON.stringify(msgs)); } catch (_) {}
      try { localStorage.setItem(LS_VIS, JSON.stringify(vis)); } catch (_) {}
      if (bc) {
        try { bc.postMessage({ messages: msgs, visitors: vis }); } catch (_) {}
      }
    }

    function mergeMessages(cloudArr, localArr) {
      const map = new Map();
      [...localArr, ...cloudArr].forEach((m) => {
        if (!m) return;
        const key = m.id != null ? String(m.id) : `${m.time || ""}_${m.author || ""}_${m.text || ""}`;
        map.set(key, m);
      });
      return Array.from(map.values())
        .sort((a, b) => Number(a.id || 0) - Number(b.id || 0))
        .slice(-150);
    }

    async function fetchWithTimeout(url, opts, ms) {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), ms || 4500);
      try {
        return await fetch(url, { ...(opts || {}), signal: ctrl.signal });
      } finally {
        clearTimeout(t);
      }
    }

    async function syncCloud(forcePush) {
      const local = readLocal();
      messages = mergeMessages(messages, local.messages);
      visitors = visitors.length ? visitors : local.visitors;

      try {
        const r = await fetchWithTimeout(`${API_URL}?_=${Date.now()}`, {}, 4500);
        if (r && r.ok) {
          const j = await r.json();
          const cMsgs = Array.isArray(j && j.messages) ? j.messages : [];
          const cVis = Array.isArray(j && j.visitors) ? j.visitors : [];
          cloudAvailable = true;

          const mergedMsgs = mergeMessages(cMsgs, messages);
          const mergedVis = cVis.length >= visitors.length ? cVis : visitors;

          messages = mergedMsgs;
          visitors = mergedVis;
          writeLocal(messages, visitors);

          document.getElementById("cloudBadge").textContent = "npoint.io ✓";
          document.getElementById("dockStatus").textContent = "в облаке";

          if (forcePush) {
            await fetchWithTimeout(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ messages: messages, visitors: visitors })
            }, 4500).catch(() => {});
          }
          return true;
        }
      } catch (_) {}

      cloudAvailable = false;
      document.getElementById("cloudBadge").textContent = "локально ✓";
      document.getElementById("dockStatus").textContent = "локальный режим";
      return false;
    }

    function renderUI() {
      const stream = document.getElementById("msgStream");
      const me = getNick();
      const list = messages.filter((m) => (m.room || m.chat || "general") === currentRoom);

      if (!list.length) {
        stream.innerHTML = `<div style="text-align:center; color:#94a3b8; font-size:13px; margin:auto 0;">В комнате «${esc(ROOM_NAMES[currentRoom])}» пока пусто — напиши сообщение, и оно появится в 3D!</div>`;
      } else {
        stream.innerHTML = list
          .map((m) => {
            const sender = m.author || m.name || "Участник";
            const mine = sender.toLowerCase() === me.toLowerCase() || currentRoom === "saved";
            return `
              <div class="msg-card ${mine ? "out" : "in"}">
                <div class="msg-meta">
                  <span>${esc(sender)}</span>
                  <span class="msg-time">${esc(m.time || "")}</span>
                </div>
                <div>${esc(m.text || "")}</div>
              </div>
            `;
          })
          .join("");
        stream.scrollTop = stream.scrollHeight;
      }

      document.getElementById("visBadge").textContent = `👀 ${visitors.length}`;
      rebuild3DMessages();
    }

    function onSend(e) {
      if (e) e.preventDefault();
      const inp = document.getElementById("chatInput");
      const text = inp.value.trim();
      if (!text) return false;

      inp.value = "";
      inp.focus();
      saveNick();

      const item = {
        id: Date.now() + Math.floor(Math.random() * 100),
        room: currentRoom,
        author: getNick(),
        text: text,
        time: nowHM(),
        date: nowFull()
      };

      messages = [...messages, item].slice(-150);
      writeLocal(messages, visitors);
      renderUI();

      document.getElementById("dockStatus").textContent = "сохранено";
      syncCloud(true).then((ok) => {
        if (!ok) {
          document.getElementById("dockStatus").textContent = "сохранено локально ✓";
        }
      });

      return false;
    }

    function switchRoom(rid) {
      currentRoom = rid;
      document.querySelectorAll(".room-tab").forEach((b) => {
        b.classList.toggle("active", b.dataset.r === rid);
      });
      renderUI();
      document.getElementById("chatInput").focus();
    }

    function toggleDock() {
      document.getElementById("dock").classList.toggle("minimized");
    }

    async function clearCurrentRoom() {
      if (!confirm(`Очистить сообщения в «${ROOM_NAMES[currentRoom]}»?`)) return;
      messages = messages.filter((m) => (m.room || m.chat || "general") !== currentRoom);
      writeLocal(messages, visitors);
      renderUI();
      if (cloudAvailable) {
        await fetchWithTimeout(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: messages, visitors: visitors })
        }, 4500).catch(() => {});
      }
    }

    async function init() {
      const savedNick = localStorage.getItem(LS_NICK);
      if (savedNick) document.getElementById("nickInput").value = savedNick;

      const local = readLocal();
      messages = local.messages;
      visitors = local.visitors;

      if (!sessionStorage.getItem(SS_VISIT)) {
        sessionStorage.setItem(SS_VISIT, "1");
        visitors = [
          {
            name: getNick(),
            time: nowFull(),
            device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "Телефон" : "Ноутбук"
          },
          ...visitors
        ].slice(0, 60);
        writeLocal(messages, visitors);
      }

      renderUI();
      await syncCloud(true);
      renderUI();
    }

    init();
    setInterval(() => {
      syncCloud(false).then(() => renderUI());
    }, 6000);
  </script>
</body>
</html>
