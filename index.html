<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВЕРИТЕ [BETA] — 3D Платформа Головоломок</title>
  <style>
    :root {
      --bg: #070913;
      --panel: rgba(18, 26, 47, 0.75);
      --cyan: #00f2fe;
      --blue: #4facfe;
      --purple: #7f00ff;
      --pink: #ff007f;
      --text: #f0f6fc;
      --text-dim: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Фоновый канвас с 3D-частицами */
    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Верхняя плашка BETA */
    .beta-banner {
      background: linear-gradient(90deg, rgba(255, 0, 127, 0.2), rgba(127, 0, 255, 0.2), rgba(0, 242, 254, 0.2));
      border-bottom: 1px solid rgba(0, 242, 254, 0.3);
      text-align: center;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan);
      position: relative;
      z-index: 10;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .beta-badge {
      background: var(--pink);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      margin-left: 6px;
      box-shadow: 0 0 8px var(--pink);
    }

    /* Шапка сайта */
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 16px 24px;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.2);
      border-radius: 20px;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-cube {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
      transform: rotate(-5deg);
      transition: transform 0.3s;
    }

    .logo-cube:hover {
      transform: rotate(5deg) scale(1.05);
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
    }

    .stats-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 8px 16px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    }

    /* Основной контент */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      position: relative;
      z-index: 1;
      width: 100%;
    }

    .controls-bar {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 20px;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
    }

    .search-input {
     background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 10px;
      padding: 10px 16px;
      color: white;
      outline: none;
      width: 260px;
      transition: all 0.3s;
    }

    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    /* Сетка головоломок */
    .puzzles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: var(--cyan);
      box-shadow: 0 15px 35px rgba(0, 242, 254, 0.25);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 12px;
      background: rgba(0, 242, 254, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
    }

    .btn-play {
      color: var(--cyan);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Модальное окно с игрой */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 18, 0.9);
      backdrop-filter: blur(20px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--cyan);
      border-radius: 24px;
      width: 100%;
      max-width: 900px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.3);
    }

    .modal-header {
      padding: 16px 24px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--pink);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }

    .modal-close:hover {
      background: var(--pink);
      box-shadow: 0 0 15px var(--pink);
    }

    .game-area {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
     justify-content: center;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .modal-footer {
      padding: 14px 24px;
      background: rgba(0, 0, 0, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Фоновые 3D частицы -->
  <canvas id="bgCanvas"></canvas>

  <!-- Плашка BETA -->
  <div class="beta-banner">
    ВЕРИТЕ 3D PLATFORM <span class="beta-badge">BETA v2.4</span> — РЕЖИМ РАННЕГО ДОСТУПА
  </div>

  <!-- Шапка -->
  <header>
    <div class="header-content">
      <div class="logo-container">
        <div class="logo-cube">В</div>
        <div>
          <div class="logo-title">ВЕРИТЕ</div>
        </div>
      </div>
      <div class="stats-box">
        <span>💡 Решено:</span>
        <span id="scoreText">0 / 9</span>
      </div>
    </div>
  </header>

  <!-- Основной раздел -->
  <main>
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск 3D головоломки...">
      <div style="display: flex; gap: 8px;">
        <button class="filter-btn active" onclick="filterCategory('all')">Все (9)</button>
        <button class="filter-btn" onclick="filterCategory('3d')">3D Механика</button>
        <button class="filter-btn" onclick="filterCategory('light')">Свет и Тень</button>
      </div>
    </div>

    <div class="puzzles-grid" id="grid">
      <!-- Карточки генерируются скриптом -->
    </div>
  </main>

  <!-- Игровой экран -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-header">
        <div>
          <h2 id="modalTitle" style="font-size: 20px; color: #fff;">Головоломка</h2>
          <p id="modalDesc" style="font-size: 12px; color: var(--text-dim);"></p>
        </div>
        <button class="modal-close" onclick="closeGame()">✕</button>
      </div>
      <div class="game-area">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div class="modal-footer">
        <span>Управление: Вращайте мышкой или касанием пальца</span>
        <button class="filter-btn" onclick="resetCurrentGame()">Сбросить уровень</button>
      </div>
    </div>
  </div>

  <script>
    // Список из 9 3D-головоломок
    const puzzles = [
      { id: 1, title: '3D Кубик Рубика', cat: '3d', desc: 'Классический объемный куб с интерактивным вращением граней.', diff: 'Средняя' },
      { id: 2, title: 'Перспективная Иллюзия', cat: 'light', desc: 'Вращайте парящие 3D-осколки, пока они не составят секретный символ.', diff: 'Легкая' },
      { id: 3, title: '3D Энерго-сеть', cat: '3d', desc: 'Поворачивайте объемные узлы и направьте импульс тока к ядру.', diff: 'Средняя' },
      { id: 4, title: 'Лазер и Зеркала', cat: 'light', desc: 'Управляйте углом 3D-зеркал для отражения светового луча в мишень.', diff: 'Сложная' },
      { id: 5, title: 'Теневой 3D-Пазл', cat: 'light', desc: 'Вращайте странный 3D-объект, чтобы его тень на стене совпала с контуром.', diff: 'Средняя' },
      { id: 6, title: 'Лабиринт со Сферой', cat: '3d', desc: 'Наклоняйте 3D-сферу, чтобы выкатить светящийся шар из лабиринта.', diff: 'Легкая' },
      { id: 7, title: 'Пространственный Замок', cat: '3d', desc: 'Совместите штифты цилиндрического 3D-механизма.', diff: 'Сложная' },
      { id: 8, title: 'Кристаллический Сдвиг', cat: '3d', desc: 'Сдвигайте прозрачные 3D-блоки для построения правильной призмы.', diff: 'Средняя' },
      { id: 9, title: 'Голографическая Матрица', cat: 'light', desc: 'Настройте фазы световых 3D-волн для сборки объема.', diff: 'Сложная' }
    ];

    let solvedCount = 0;
    let currentGameId = null;
    let animId = null;

    // Генерация карточек
    function renderGrid(items) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      items.forEach(p => {
       const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openGame(p);
        card.innerHTML = `
          <div>
            <span class="card-badge">${p.cat === '3d' ? '3D Механика' : 'Свет и Тень'} • ${p.diff}</span>
            <div class="card-title">${p.title}</div>
            <div class="card-desc">${p.desc}</div>
          </div>
          <div class="card-footer">
            <span class="btn-play">Запустить 3D ➔</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderGrid(puzzles);

    // Поиск и Фильтры
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderGrid(puzzles.filter(p => p.title.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)));
    });

    function filterCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (cat === 'all') renderGrid(puzzles);
      else renderGrid(puzzles.filter(p => p.cat === cat));
    }

    // Запуск игры на Canvas
    function openGame(p) {
      currentGameId = p.id;
      document.getElementById('modalTitle').innerText = p.title + ' [BETA]';
      document.getElementById('modalDesc').innerText = p.desc;
      document.getElementById('modal').classList.add('active');
      start3DRender();
    }

    function closeGame() {
      document.getElementById('modal').classList.remove('active');
      if (animId) cancelAnimationFrame(animId);
    }

    function resetCurrentGame() {
      start3DRender();
    }

    // Рендер 3D объекта на игровой Canvas
    function start3DRender() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      let angleX = 0;
      let angleY = 0;
      let isDragging = false;
      let lastX, lastY;

      canvas.onmousedown = (e) => {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      };

      window.onmouseup = () => isDragging = false;

      window.onmousemove = (e) => {
        if (!isDragging) return;
        let dx = e.clientX - lastX;
        let dy = e.clientY - lastY;
        angleY += dx * 0.01;
        angleX += dy * 0.01;
        lastX = e.clientX;
        lastY = e.clientY;
      };

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let cx = canvas.width / 2;
        let cy = canvas.height / 2;

        // Рисуем вращающийся 3D объект в зависимости от ID
        ctx.save();
        ctx.translate(cx, cy);

        // Авто-вращение, если не тянут мышкой
        if (!isDragging) {
          angleY += 0.01;
          angleX += 0.005;
        }

        // Простая 3D проекция куба/фигуры
        let size = 100;
        let nodes = [
          [-size, -size, -size], [size, -size, -size],
          [size, size, -size], [-size, size, -size],
          [-size, -size, size], [size, -size, size],
          [size, size, size], [-size, size, size]
        ];

        let projected = nodes.map(node => {
          let x = node[0], y = node[1], z = node[2];

          // Вращение Y
          let x1 = x * Math.cos(angleY) - z * Math.sin(angleY);
          let z1 = x * Math.sin(angleY) + z * Math.cos(angleY);

          // Вращение X
          let y2 = y * Math.cos(angleX) - z1 * Math.sin(angleX);
          let z2 = y * Math.sin(angleX) + z1 * Math.cos(angleX);

          let fov = 400;
          let scale = fov / (fov + z2 + 200);

          return [x1 * scale, y2 * scale];
        });

        // Ребра
        let edges = [
          [0,1],[1,2],[2,3],[3,0],
          [4,5],[5,6],[6,7],[7,4],
          [0,4],[1,5],[2,6],[3,7]
        ];

        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 3;
       ctx.shadowBlur = 15;
        ctx.shadowColor = '#00f2fe';

        edges.forEach(e => {
          ctx.beginPath();
          ctx.moveTo(projected[e[0]][0], projected[e[0]][1]);
          ctx.lineTo(projected[e[1]][0], projected[e[1]][1]);
          ctx.stroke();
        });

        // Вершины (точки)
        projected.forEach(p => {
          ctx.fillStyle = '#ff007f';
          ctx.beginPath();
          ctx.arc(p[0], p[1], 6, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();

        animId = requestAnimationFrame(draw);
      }

      if (animId) cancelAnimationFrame(animId);
      draw();
    }

    // Фоновая 3D сетка частиц
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.onresize = resizeBg;
    resizeBg();

    let pts = Array.from({length: 60}, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5
    }));

    function animBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      bgCtx.fillStyle = 'rgba(0, 242, 254, 0.3)';
      
      pts.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;

        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        bgCtx.fill();
      });

      requestAnimationFrame(animBg);
    }
    animBg();
  </script>
</body>
</html>
