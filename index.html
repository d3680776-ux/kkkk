<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Пойдёшь гулять?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 40px 20px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 360px;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-top: 10px;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .buttons-container {
      position: relative;
      width: 100%;
      height: 180px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      position: absolute;
      transition: transform 0.15s ease, top 0.2s ease, left 0.2s ease;
    }

    /* Кнопка "Да" зафиксирована слева */
    .btn-yes {
      background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(0, 176, 155, 0.4);
      left: 20px;
      top: 60px;
    }

    .btn-yes:active {
      transform: scale(0.95);
    }

    /* Кнопка "Нет" изначально справа */
    .btn-no {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4);
      right: 20px;
      top: 60px;
      touch-action: manipulation;
    }

    /* Окно при согласии */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #ffffff;
      color: #222;
      padding: 35px 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 300px;
      animation: popIn 0.3s ease-out;
    }

    .modal-content h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #2e7d32;
    }

    .modal-content p {
      font-size: 1.1rem;
      color: #555;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Пойдёшь гулять?</h1>
    <div class="buttons-container" id="area">
      <button class="btn btn-yes" onclick="acceptInvitation()">Да!</button>
      <button class="btn btn-no" id="noBtn">Нет</button>
    </div>
  </div>

  <div class="modal" id="winModal">
    <div class="modal-content">
      <h2>Отлично! 🎉</h2>
      <p>Я знал, что ты согласишься! Собирайся! 🚀</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const area = document.getElementById('area');
    const winModal = document.getElementById('winModal');

    function moveButton(e) {
      if (e) e.preventDefault();

      // Размеры контейнера и самой кнопки
      const areaWidth = area.clientWidth;
      const areaHeight = area.clientHeight;
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Вычисляем случайные X и Y строго внутри блока
      const maxX = areaWidth - btnWidth;
      const maxY = areaHeight - btnHeight;
      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY);

      // Применяем новые координаты
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
      noBtn.style.right = 'auto'; // Сбрасываем начальное прикрепление справа
    }

    // Убегает при наведении мышки и при попытке нажатия пальцем
    noBtn.addEventListener('mouseenter', moveButton);
    noBtn.addEventListener('touchstart', moveButton, { passive: false });
    noBtn.addEventListener('click', moveButton);

    function acceptInvitation() {
      winModal.style.display = 'flex';
    }
  </script>

</body>
</html>
