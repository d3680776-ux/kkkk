<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МемЗвук - 3D Мемы и Мини-Игры</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0d0f18;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #1a1c29 0%, #0d0f18 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #ff007f, #7928ca, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: #a0aec0;
      font-size: 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      perspective: 1000px;
    }

    /* 3D Карточка */
    .meme-card {
      background: rgba(25, 28, 43, 0.8);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.1s ease, box-shadow 0.3s ease;
      transform-style: preserve-3d;
      cursor: pointer;
      position: relative;
    }

    .meme-card:hover {
      box-shadow: 0 15px 40px rgba(121, 40, 202, 0.4);
      border-color: rgba(121, 40, 202, 0.5);
    }

    .meme-img-container {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 15px;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      transform: translateZ(30px);
    }

    .meme-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .meme-card:hover .meme-img-container img {
      transform: scale(1.05);
    }

    .meme-title {
      font-size: 1.25rem;
      font-weight: bold;
      margin-bottom: 6px;
      transform: translateZ(20px);
    }

    .meme-desc {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 15px;
      transform: translateZ(15px);
    }

    .card-actions {
      display: flex;
      gap: 10px;
      transform: translateZ(25px);
    }

    .btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.9rem;
    }

    .btn-sound {
      background: #fe2c55;
      color: white;
    }

    .btn-sound:hover {
      background: #e11d43;
    }

    .btn-game {
      background: #00f2fe;
      color: #0d0f18;
    }

    .btn-game:hover {
      background: #00c7d4;
    }

    /* Модальное окно мини-игры */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #181b2e;
      width: 90%;
      max-width: 450px;
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: #a0aec0;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    .modal h2 {
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    /* Игровые зоны */
    .game-box {
      background: #111322;
      border-radius: 12px;
      padding: 20px;
      margin-top: 15px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 1px dashed rgba(255,255,255,0.2);
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00f2fe;
      margin-bottom: 10px;
    }

    .target-btn {
      background: linear-gradient(135deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255,0,127,0.4);
      transition: transform 0.1s;
    }

    .target-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <header>
    <h1>🔊 МемЗвук 3D</h1>
    <p>Кликай на карточки, слушай легендарные звуки мемов и играй в мини-игры!</p>
  </header>

  <div class="container" id="cards-container">
    
    <!-- Мем 1: Рикардо -->
    <div class="meme-card" data-sound="ricardo">
      <div class="meme-img-container">
        <img src="https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=500&q=80" alt="Рикардо">
      </div>
      <div class="meme-title">Танец Рикардо</div>
      <div class="meme-desc">Легендарный ритм и фирменный танец.</div>
      <div class="card-actions">
        <button class="btn btn-sound" onclick="event.stopPropagation(); playMemeSound('ricardo')">Звук 🎵</button>
        <button class="btn btn-game" onclick="event.stopPropagation(); openGame('ricardo')">Игра 🎮</button>
      </div>
    </div>

    <!-- Мем 2: Котэ / Поп-Кэт -->
    <div class="meme-card" data-sound="popcat">
      <div class="meme-img-container">
        <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="Pop Cat">
      </div>
      <div class="meme-title">Поп-Кэт кликер</div>
      <div class="meme-desc">Широко открывающий рот мемный котик.</div>
      <div class="card-actions">
        <button class="btn btn-sound" onclick="event.stopPropagation(); playMemeSound('popcat')">Звук 🎵</button>
        <button class="btn btn-game" onclick="event.stopPropagation(); openGame('popcat')">Игра 🎮</button>
      </div>
    </div>

    <!-- Мem 3: Скибиди / Басс -->
    <div class="meme-card" data-sound="bass">
      <div class="meme-img-container">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=500&q=80" alt="Bass Boost">
      </div>
      <div class="meme-title">Эпичный Басс Буст</div>
      <div class="meme-desc">Взрывной бас для самых громких моментов.</div>
      <div class="card-actions">
        <button class="btn btn-sound" onclick="event.stopPropagation(); playMemeSound('bass')">Звук 🎵</button>
        <button class="btn btn-game" onclick="event.stopPropagation(); openGame('bass')">Игра 🎮</button>
      </div>
    </div>

  </div>

  <!-- Модальное окно игры -->
  <div class="modal-overlay" id="gameModal" onclick="closeGame()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeGame()">&times;</button>
      <h2 id="modalTitle">Мини-игра</h2>
      <div class="game-box" id="gameArea">
        <!-- Содержимое игры подставляется через JS -->
      </div>
    </div>
  </div>

  <script>
    // 3D Tilt эффект для карточек
    document.querySelectorAll('.meme-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -12;
        const rotateY = ((x - centerX) / centerX) * 12;
        
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      });
    });

    // Синтезатор звуков мемов через Web Audio API (чтобы не нужны были внешние аудиофайлы)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playMemeSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'ricardo') {
        // Ритмичный басовый мотив
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'popcat') {
        // Звук "ПОП!"
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'bass') {
        // Эпичный низкий удар
        osc.type = 'square';
        osc.frequency.setValueAtTime(80, now);
        osc.frequency.linearRampToValueAtTime(30, now + 0.5);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    // Управление мини-играми
    let currentGameTimer = null;

    function openGame(memeType) {
      const modal = document.getElementById('gameModal');
      const title = document.getElementById('modalTitle');
      const area = document.getElementById('gameArea');
      modal.classList.add('active');
      area.innerHTML = '';

      if (memeType === 'ricardo') {
        title.innerText = 'Ритм-кликер Рикардо';
        let score = 0;
        area.innerHTML = `
          <div class="score-board">Счет: <span id="rScore">0</span></div>
          <button class="target-btn" onclick="let s=document.getElementById('rScore'); s.innerText=++${score}; playMemeSound('ricardo')">Танцевать! 🔥</button>
        `;
      } else if (memeType === 'popcat') {
        title.innerText = 'Поп-Кэт Мастер';
        let pops = 0;
        area.innerHTML = `
          <div class="score-board">Клики: <span id="pScore">0</span></div>
          <button class="target-btn" onclick="let s=document.getElementById('pScore'); s.innerText=++${pops}; playMenseSound('popcat')">Открыть рот 🐱</button>
        `;
        // Исправление вызова звука для попката в кнопке
        area.querySelector('button').setAttribute('onclick', "let s=document.getElementById('pScore'); s.innerText=++window.popCount; playMemeSound('popcat');");
        window.popCount = 0;
      } else if (memeType === 'bass') {
        title.innerText = 'Взрыв Баса (Успей нажать)';
        area.innerHTML = `
          <div class="score-board" id="bassTimer">Нажми, пока горит бас!</div>
          <button class="target-btn" id="bassBtn" onclick="winBassGame()">💥 БАХ!</button>
        `;
      }
    }

    function closeGame() {
      document.getElementById('gameModal').classList.remove('active');
      if (currentGameTimer) clearTimeout(currentGameTimer);
    }

    function winBassGame() {
    playMemeSound('bass');
      document.getElementById('bassTimer').innerText = 'Победа! Эпичный бас сработал! 😎';
    }
  </script>
</body>
</html>
