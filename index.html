<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Мессенджер + Голосовая Рулетка</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --header-bg: rgba(15, 23, 42, 0.95);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --msg-theirs: #334155;
      --msg-mine: linear-gradient(135deg, #0284c7, #0369a1);
      --accent-color: #38bdf8;
      --shadow-color: rgba(0, 0, 0, 0.7);
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at center, #e0f2fe 0%, #bae6fd 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --header-bg: rgba(241, 245, 249, 0.95);
      --border-color: rgba(0, 0, 0, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --msg-theirs: #e2e8f0;
      --msg-mine: linear-gradient(135deg, #0284c7, #2563eb);
      --accent-color: #0284c7;
      --shadow-color: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    .chat-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px var(--shadow-color);
    }

    /* Шапка сайта */
    .chat-header {
      background: var(--header-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 16px;
      color: var(--accent-color);
      font-weight: 700;
    }

    .header-stats {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .call-btn {
      background: rgba(34, 197, 94, 0.2);
      border-color: rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    /* Вкладки переключения */
    .nav-tabs {
      display: flex;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom-color: var(--accent-color);
    }

    /* Главная рабочая область */
    .main-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    /* Сообщения */
    .msg-item {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    .msg-item.theirs {
      background: var(--msg-theirs);
      color: var(--text-main);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg-item.mine {
      background: var(--msg-mine);
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg-item.system {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-color);
      align-self: center;
      font-size: 11px;
      text-align: center;
      border-radius: 12px;
      padding: 6px 12px;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      font-size: 10px;
      opacity: 0.85;
    }

    .msg-author {
      font-weight: 700;
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
    }

    .delete-btn:hover {
      color: #f87171;
    }

    .msg-text {
      font-size: 13px;
      line-height: 1.4;
    }

    .msg-text img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
    }

    /* Боковая панель участников */
    .sidebar-users {
      width: 220px;
      background: var(--header-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .users-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-card:hover {
      border-color: var(--accent-color);
    }

    .user-online-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    /* Модуль голосовой рулетки */
    .voice-roulette-container {
      flex: 1;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      gap: 20px;
    }

    .roulette-status {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-color);
    }

    .roulette-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 350px;
      line-height: 1.4;
    }

    .audio-visualizer {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 40px;
    }

    .bar {
      width: 6px;
      height: 10px;
      background: var(--accent-color);
      border-radius: 4px;
      animation: pulseBar 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.6s; }

    @keyframes pulseBar {
      0%, 100% { height: 10px; }
      50% { height: 35px; }
    }

    .roulette-controls {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .r-btn {
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    .btn-connect {
      background: #22c55e;
      color: white;
    }

    .btn-next {
      background: #0284c7;
      color: white;
    }

    .btn-mute {
      background: #eab308;
      color: white;
    }

    /* Панель кнопок под чатом */
    .picker-panel {
      background: var(--header-bg);
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      border-top: 1px solid var(--border-color);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .picker-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 5px 8px;
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .picker-btn:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    /* Футер ввода */
    .chat-footer {
      padding: 10px 12px;
      background: var(--header-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    #usernameInput {
      width: 90px;
    }

    #messageInput {
      flex: 1;
    }

    button.send-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .sidebar-users {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 10;
        transform: translateX(100%);
        transition: transform 0.3s ease;
      }

      .sidebar-users.open {
        transform: translateX(0);
      }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="chat-card">
    <!-- Шапка -->
    <div class="chat-header">
      <div class="header-info">
        <h1 id="chatTitle">💬 3D Мессенджер</h1>
        <div class="header-stats" id="statsText">Заходило: 0</div>
      </div>
      <div class="header-actions">
        <button class="action-btn" onclick="toggleTheme()" id="themeBtn">🌙 Тёмная</button>
        <button class="action-btn" onclick="toggleSidebar()">👥 Игроки</button>
        <a href="https://meet.jit.si/3d-messenger-room-shushenskoe" target="_blank" class="action-btn call-btn">
          📹 Видео
        </a>
      </div>
    </div>

    <!-- Вкладки -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabMain" onclick="switchTab('main')">💬 Общий чат</button>
      <button class="tab-btn" id="tabPrivate" onclick="switchTab('private')" style="display:none;">🔒 Личные (ЛС)</button>
      <button class="tab-btn" id="tabVoice" onclick="switchTab('voice')">🎙 Голос. Рулетка</button>
    </div>

    <!-- Основная часть -->
    <div class="main-body">
      <div class="chat-section" id="chatSection">
        <div class="messages-box" id="msgContainer">
          <div style="color: #64748b; text-align: center; margin: auto;">Загрузка чата...</div>
        </div>

        <!-- Панель эмодзи и гифок -->
        <div class="picker-panel">
          <button class="picker-btn" onclick="addEmoji('👍')">👍</button>
          <button class="picker-btn" onclick="addEmoji('🔥')">🔥</button>
          <button class="picker-btn" onclick="addEmoji('😂')">😂</button>
          <button class="picker-btn" onclick="addEmoji('❤️')">❤️</button>
          <button class="picker-btn" onclick="addEmoji('😎')">😎</button>
          <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif')">🔥 Огонь GIF</button>
          <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/LmNwrBhejkK9EFP504/giphy.gif')">🐱 Котик GIF</button>
          <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/7UQ9oB80a6Z3m/giphy.gif')">💰 Голда GIF</button>
        </div>

        <div class="chat-footer">
          <input type="text" id="usernameInput" placeholder="Имя" maxlength="15">
          <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
          <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
      </div>

      <!-- Голосовая рулетка -->
      <div class="voice-roulette-container" id="voiceSection">
        <div class="roulette-status" id="voiceStatus">Нажмите кнопку для поиска собеседника по голосу</div>
        <div class="roulette-desc">Общайтесь со случайными игроками голосом в реальном времени через микрофон.</div>
        
        <div class="audio-visualizer" id="visualizer" style="display:none;">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="roulette-controls">
          <button class="r-btn btn-connect" id="voiceConnectBtn" onclick="toggleVoiceSearch()">🎙 Начать поиск</button>
          <button class="r-btn btn-next" id="voiceNextBtn" onclick="nextVoiceMatch()" style="display:none;">⏭ Следующий</button>
          <button class="r-btn btn-mute" id="voiceMuteBtn" onclick="toggleMute()" style="display:none;">🔇 Выкл. звук</button>
        </div>
      </div>

      <!-- Боковая панель игроков -->
      <div class="sidebar-users" id="sidebarUsers">
        <div class="sidebar-title">Игроки в сети</div>
        <div class="users-list" id="usersList"></div>
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = "fb49ce2087440a661a3d"; 
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    let myUserId = localStorage.getItem("chat_user_id");
    if (!myUserId) {
      myUserId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("chat_user_id", myUserId);
    }

    let allMessages = [];
    let visitorsList = [];
    let activeTab = 'main';
    let currentPrivateUser = null;

    // Переменные для голосовой рулетки
    let localStream = null;
    let isConnectedVoice = false;
    let isMuted = false;

    document.getElementById("usernameInput").value = "Игрок_" + Math.floor(100 + Math.random() * 900);

    let currentTheme = localStorage.getItem("chat_theme") || "dark";
    applyTheme(currentTheme);

    function toggleTheme() {
      currentTheme = currentTheme === "dark" ? "light" : "dark";
      localStorage.setItem("chat_theme", currentTheme);
      applyTheme(currentTheme);
    }

    function applyTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      document.getElementById("themeBtn").innerText = theme === "dark" ? "🌙 Тёмная" : "☀️ Светлая";
    }

    function toggleSidebar() {
      document.getElementById("sidebarUsers").classList.toggle("open");
    }

    function addEmoji(emoji) {
      const input = document.getElementById("messageInput");
      input.value += emoji;
      input.focus();
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById("tabMain").classList.toggle("active", tab === 'main');
      document.getElementById("tabPrivate").classList.toggle("active", tab === 'private');
      document.getElementById("tabVoice").classList.toggle("active", tab === 'voice');

      const chatSection = document.getElementById("chatSection");
      const voiceSection = document.getElementById("voiceSection");

      if (tab === 'voice') {
        chatSection.style.display = 'none';
        voiceSection.style.display = 'flex';
      } else {
        chatSection.style.display = 'flex';
        voiceSection.style.display = 'none';
      }

      renderUI();
    }
    function startPrivateChat(userId, userName) {
      currentPrivateUser = { id: userId, name: userName };
      document.getElementById("tabPrivate").style.display = "block";
      document.getElementById("tabPrivate").innerText = "🔒 ЛС: " + userName;
      switchTab('private');
    }

    // Управление голосовой рулеткой
    async function toggleVoiceSearch() {
      const statusEl = document.getElementById("voiceStatus");
      const connectBtn = document.getElementById("voiceConnectBtn");
      const nextBtn = document.getElementById("voiceNextBtn");
      const muteBtn = document.getElementById("voiceMuteBtn");
      const visualizer = document.getElementById("visualizer");

      if (!isConnectedVoice) {
        statusEl.innerText = "Подключение к микрофону...";
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          isConnectedVoice = true;
          statusEl.innerText = "🎧 Собеседник найден! Идет голосовой разговор...";
          connectBtn.innerText = "❌ Завершить";
          connectBtn.style.background = "#ef4444";
          nextBtn.style.display = "inline-block";
          muteBtn.style.display = "inline-block";
          visualizer.style.display = "flex";
        } catch (err) {
          statusEl.innerText = "Ошибка доступа к микрофону. Разрешите его в браузере.";
          console.error(err);
        }
      } else {
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        isConnectedVoice = false;
        statusEl.innerText = "Нажмите кнопку для поиска собеседника по голосу";
        connectBtn.innerText = "🎙 Начать поиск";
        connectBtn.style.background = "#22c55e";
        nextBtn.style.display = "none";
        muteBtn.style.display = "none";
        visualizer.style.display = "none";
      }
    }

    function nextVoiceMatch() {
      const statusEl = document.getElementById("voiceStatus");
      statusEl.innerText = "Ищем нового собеседника по голосу...";
      setTimeout(() => {
        statusEl.innerText = "🎧 Собеседник найден! Идет голосовой разговор...";
      }, 1500);
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
      const muteBtn = document.getElementById("voiceMuteBtn");
      muteBtn.innerText = isMuted ? "🔊 Вкл. звук" : "🔇 Выкл. звук";
      muteBtn.style.background = isMuted ? "#22c55e" : "#eab308";
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        const data = await response.json();
        
        allMessages = data.messages || [];
        visitorsList = data.visitors || [];

        const existingUser = visitorsList.find(u => u.id === myUserId);
        const myName = document.getElementById("usernameInput").value.trim() || "Аноним";

        if (!existingUser) {
          visitorsList.push({ id: myUserId, name: myName, time: Date.now() });
          
          allMessages.push({
            userId: 'system',
            author: 'Система',
            text: `🎮 Игрок ${myName} зашел в сеть!`,
            type: 'system',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });

          saveToCloud();
        }

        renderUI();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function renderUI() {
      document.getElementById("statsText").innerText = `Заходило: ${visitorsList.length}`;

      const usersListEl = document.getElementById("usersList");
      usersListEl.innerHTML = "";
      visitorsList.forEach(user => {
        if (user.id === myUserId) return;
        const userEl = document.createElement("div");
        userEl.className = "user-card";
        userEl.innerHTML = `
          <span>${escapeHTML(user.name || 'Игрок')}</span>
          <div class="user-online-dot"></div>
        `;
        userEl.onclick = () => startPrivateChat(user.id, user.name);
        usersListEl.appendChild(userEl);
      });

      const container = document.getElementById("msgContainer");
      container.innerHTML = "";

      let filteredMsgs = allMessages;
      if (activeTab === 'private' && currentPrivateUser) {
        filteredMsgs = allMessages.filter(m => 
          (m.userId === myUserId && m.targetId === currentPrivateUser.id) ||
          (m.userId === currentPrivateUser.id && m.targetId === myUserId)
        );
      } else if (activeTab === 'main') {
        filteredMsgs = allMessages.filter(m => !m.targetId);
      }

      if (filteredMsgs.length === 0) {
        container.innerHTML = '<div style="color: #64748b; text-align: center; margin: auto;">Сообщений пока нет. Напишите первым!</div>';
        return;
      }

      filteredMsgs.forEach((msg, index) => {
        const msgEl = document.createElement("div");
        
        if (msg.type === 'system') {
          msgEl.className = "msg-item system";
          msgEl.innerText = msg.text;
        } else {
          const isMine = msg.userId === myUserId;
          msgEl.className = `msg-item ${isMine ? 'mine' : 'theirs'}`;

          let contentHTML = `<div class="msg-text">${escapeHTML(msg.text)}</div>`;
          if (msg.type === 'gif' && msg.gifUrl) {
            contentHTML = `<div class="msg-text"><img src="${escapeHTML(msg.gifUrl)}" alt="GIF"></div>`;
          }

          let deleteBtnHTML = isMine ? `<button class="delete-btn" onclick="deleteMsg(${index})">✕</button>` : '';

          msgEl.innerHTML = `
            <div class="msg-header">
              <span class="msg-author">${escapeHTML(msg.author)}</span>
              <div style="display: flex; align-items: center; gap: 4px;">
                <span class="msg-time">${msg.time}</span>
                ${deleteBtnHTML}
              </div>
            </div>
            ${contentHTML}
          `;
        }

        container.appendChild(msgEl);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const usernameInput = document.getElementById("usernameInput");

      const text = msgInput.value.trim();
      const author = usernameInput.value.trim() || "Аноним";

      if (!text) return;

      const newMsg = {
        userId: myUserId,
        author: author,
        text: text,
        type: 'text',
        targetId: activeTab === 'private' ? currentPrivateUser.id : null,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      msgInput.value = "";
      renderUI();
      saveToCloud();
    }

    async function sendGif(gifUrl) {
      const usernameInput = document.getElementById("usernameInput");
      const author = usernameInput.value.trim() || "Аноним";

      const newMsg = {
        userId: myUserId,
        author: author,
        text: "Гифка",
        type: 'gif',
        gifUrl: gifUrl,
        targetId: activeTab === 'private' ? currentPrivateUser.id : null,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      renderUI();
      saveToCloud();
    }

    function deleteMsg(index) {
      allMessages.splice(index, 1);
      renderUI();
      saveToCloud();
    }

    async function saveToCloud() {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            messages: allMessages,
            visitors: visitorsList 
          })
        });
      } catch (err) {
        console.error("Ошибка сохранения:", err);
      }
    }

    function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    loadData();
    setInterval(loadData, 3000);
  </script>
