<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Онлайн Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center; /* Центрирование по горизонтали */
      align-items: center;     /* Центрирование по вертикали */
      padding: 16px;
    }

    .chat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      height: 75vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .chat-header {
      background: #0f172a;
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 18px;
      color: #38bdf8;
    }

    .status {
      font-size: 12px;
      color: #4ade80;
    }

    .messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-item {
      background: #334155;
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .msg-author {
      font-weight: 700;
      color: #38bdf8;
    }

    .msg-time {
      color: #94a3b8;
    }

    .msg-text {
      font-size: 14px;
      color: #f1f5f9;
    }

    .chat-footer {
      padding: 14px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    #usernameInput {
      width: 110px;
    }

    #messageInput {
      flex: 1;
    }

    button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <h1>💬 Чат онлайн</h1>
      <span class="status">● В сети</span>
    </div>

    <div class="messages-box" id="msgContainer">Загрузка сообщений...</div>

    <div class="chat-footer">
      <input type="text" id="usernameInput" placeholder="Имя" maxlength="15">
      <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Отправить</button>
    </div>
  </div>

  <script>
    // Твой уникальный ID из npoint.io уже подставлен!
    const BIN_ID = "fb49ce2087440a661a3d"; 
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    let allMessages = [];

    // Генерируем имя по умолчанию
    document.getElementById("usernameInput").value = "Игрок_" + Math.floor(100 + Math.random() * 900);

    // Загрузка сообщений из базы
    async function loadMessages() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        allMessages = data.messages || [];
        renderUI();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    // Отображение сообщений на экране
    function renderUI() {
      const container = document.getElementById("msgContainer");
      if (allMessages.length === 0) {
      container.innerHTML = '<div style="color: #64748b; text-align: center;">Сообщений пока нет. Напиши первым!</div>';
        return;
      }

      container.innerHTML = "";
      allMessages.forEach(msg => {
        const msgEl = document.createElement("div");
        msgEl.className = "msg-item";
        msgEl.innerHTML = `
          <div class="msg-header">
            <span class="msg-author">${escapeHTML(msg.author)}</span>
            <span class="msg-time">${msg.time}</span>
          </div>
          <div class="msg-text">${escapeHTML(msg.text)}</div>
        `;
        container.appendChild(msgEl);
      });

      container.scrollTop = container.scrollHeight;
    }

    // Отправка нового сообщения
    async function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const usernameInput = document.getElementById("usernameInput");

      const text = msgInput.value.trim();
      const author = usernameInput.value.trim() || "Аноним";

      if (!text) return;

      const newMsg = {
        author: author,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      msgInput.value = "";
      renderUI();

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: allMessages })
        });
      } catch (err) {
        console.error("Ошибка сохранения:", err);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    // Загружаем при старте и обновляем каждые 3 секунды
    loadMessages();
    setInterval(loadMessages, 3000);
  </script>
</body>
</html>
