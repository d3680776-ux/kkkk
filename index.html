<body>

  <div class="app-container">
    <!-- Левый блок чата -->

          </a>
        </div>

      <!-- Переключатель комнат -->
      <div class="room-bar" id="roomBar">
        <div class="room-tab active" onclick="switchRoom('global')">🌐 Общий Чат</div>
      </div>

      <div class="messages-box" id="msgContainer">
        <div style="color: #64748b; text-align: center; margin: auto;">Загрузка чата...</div>
      </div>
      <div class="picker-panel">
        <button class="picker-btn" onclick="addEmoji('👍')">👍</button>
        <button class="picker-btn" onclick="addEmoji('🔥')">🔥</button>
        <button class="picker-btn" onclick="addEmoji('😂')">😂</button>
        <button class="picker-btn" onclick="addEmoji('❤️')">❤️</button>
        <button class="picker-btn" onclick="addEmoji('😎')">😎</button>
        <button class="picker-btn" onclick="addEmoji('🎉')">🎉</button>
        <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif')">🔥 Огонь GIF</button>
        <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/LmNwrBhejkK9EFP504/giphy.gif')">🐱 Котик GIF</button>
      </div>

      <div class="chat-footer">
        <input type="text" id="usernameInput" placeholder="Имя" maxlength="15" onchange="updateMyUsername()">
        <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>

    <!-- Правая панель участников -->
    <div class="users-sidebar" id="usersSidebar">
      <div class="sidebar-header">
        👥 Игроки в сети
      </div>
      <div class="users-list" id="usersList">
        <div style="color: #64748b; text-align: center; font-size: 12px; margin-top: 10px;">Загрузка...</div>
      </div>
    </div>

    <!-- Модальное окно Чат-рулетки -->
    <div class="roulette-overlay" id="rouletteOverlay">
      <div class="avatar-circle">
        <div class="pulse-ring" id="pulseRing"></div>
        <span id="partnerAvatar">🎧</span>
      </div>

      <h2 id="rouletteStatus" style="font-size: 18px; color: #e2e8f0;">Поиск собеседника...</h2>
      <p id="partnerName" style="font-size: 12px; color: #94a3b8; margin-top: 4px;">Подключаем микрофон...</p>

      <div class="audio-visualizer" id="visualizer">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>

      <div class="roulette-controls">
        <button class="ctrl-btn btn-mute" id="muteBtn" onclick="toggleMute()">🎙️ Микр. вкл</button>
        <button class="ctrl-btn btn-next" onclick="nextPartner()">⏭ Следующий</button>
        <button class="ctrl-btn btn-close" onclick="stopRoulette()">✖ Выход</button>
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = "fb49ce2087440a661a3d"; 
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    let myUserId = localStorage.getItem("chat_user_id");
    if (!myUserId) {
      myUserId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("chat_user_id", myUserId);
    }

    let myUsername = "Игрок_" + Math.floor(100 + Math.random() * 900);
    document.getElementById("usernameInput").value = myUsername;

    let activeRoom = "global"; // "global" или ID собеседника
    let allMessages = [];
    let usersData = {}; // { userId: { name, lastSeen } }
    let localStream = null;
    let isMuted = false;
    let visualizerInterval = null;
    let hasAnnouncedJoin = false;

    function addEmoji(emoji) {
      const input = document.getElementById("messageInput");
      input.value += emoji;
      input.focus();
    }

    function toggleUsersSidebar() {
      document.getElementById("usersSidebar").classList.toggle("mobile-open");
    }

    function updateMyUsername() {
      myUsername = document.getElementById("usernameInput").value.trim() || "Аноним";
      saveToCloud();
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        const data = await response.json();
        
        allMessages = data.messages || [];
        usersData = data.users || {};

        // Регистрируем/обновляем текущего пользователя
      if (!usersData[myUserId] || usersData[myUserId].name !== myUsername) {
          usersData[myUserId] = { name: myUsername, lastSeen: Date.now() };

          // Системное сообщение при входе
          if (!hasAnnouncedJoin) {
            allMessages.push({
              userId: "system",
              author: "Система",
              text: `🎮 Игрок ${myUsername} зашел в сеть!`,
              type: "system",
              room: "global",
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
            hasAnnouncedJoin = true;
          }

          saveToCloud();
        } else {
          usersData[myUserId].lastSeen = Date.now();
        }

        renderUI();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function switchRoom(roomId) {
      activeRoom = roomId;
      document.getElementById("usersSidebar").classList.remove("mobile-open");
      renderUI();
    }

    function renderUI() {
      // Обновление заголовка
      const chatTitle = document.getElementById("chatTitle");
      if (activeRoom === "global") {
        chatTitle.innerText = "💬 Общий Чат";
      } else {
        const partnerName = usersData[activeRoom] ? usersData[activeRoom].name : "Игрок";
        chatTitle.innerText = "🔒 ЛС: " + partnerName;
      }

      // Обновление вкладок комнат
      const roomBar = document.getElementById("roomBar");
      let tabsHTML = `<div class="room-tab ${activeRoom === 'global' ? 'active' : ''}" onclick="switchRoom('global')">🌐 Общий Чат</div>`;
      
      Object.keys(usersData).forEach(uId => {
        if (uId !== myUserId) {
          const isCurrent = activeRoom === uId;
          tabsHTML += `<div class="room-tab ${isCurrent ? 'active' : ''}" onclick="switchRoom('${uId}')">💬 ${escapeHTML(usersData[uId].name)}</div>`;
        }
      });
      roomBar.innerHTML = tabsHTML;

      // Отрисовка списка игроков справа
      const usersList = document.getElementById("usersList");
      const userIds = Object.keys(usersData);
      document.getElementById("statsText").innerText = `Заходило: ${userIds.length}`;

      usersList.innerHTML = "";
      userIds.forEach(uId => {
        if (uId === myUserId) return;
        const u = usersData[uId];
        const userCard = document.createElement("div");
        userCard.className = "user-card";
        userCard.onclick = () => switchRoom(uId);
        userCard.innerHTML = `
          <div class="user-info">
            <div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div>
            <div class="user-name">${escapeHTML(u.name)}</div>
          </div>
          <span class="pm-badge">ЛС</span>
        `;
        usersList.appendChild(userCard);
      });

      // Отрисовка сообщений
      const container = document.getElementById("msgContainer");
      const filteredMessages = allMessages.filter(msg => {
        if (activeRoom === "global") {
          return !msg.room || msg.room === "global";
        } else {
          // Сообщения ЛС только между мной и выбравшим собеседником
          return (msg.userId === myUserId && msg.targetId === activeRoom) ||
                 (msg.userId === activeRoom && msg.targetId === myUserId);
        }
      });

      if (filteredMessages.length === 0) {
        container.innerHTML = '<div style="color: #64748b; text-align: center; margin: auto;">Сообщений пока нет. Напишите первым!</div>';
        return;
      }

      container.innerHTML = "";
      filteredMessages.forEach((msg) => {
        const msgIndex = allMessages.indexOf(msg);
        const msgEl = document.createElement("div");

        if (msg.type === 'system') {
          msgEl.className = "msg-item system";
          msgEl.innerText = msg.text;
        } else {
          const isMine = msg.userId === myUserId;
          msgEl.className = `msg-item ${isMine ? 'mine' : 'theirs'}`;
          let contentHTML = `<div class="msg-text">${escapeHTML(msg.text)}</div>`;
          if (msg.type === 'gif' && msg.gifUrl) {
            contentHTML = `<div class="msg-text"><img src="${escapeHTML(msg.gifUrl)}" alt="GIF"></div>`;
          }

          let deleteBtnHTML = '';
          if (isMine) {
            deleteBtnHTML = `<button class="delete-btn" onclick="deleteMsg(${msgIndex})">✕</button>`;
          }

          msgEl.innerHTML = `
            <div class="msg-header">
              <span class="msg-author">${escapeHTML(msg.author)}</span>
              <div style="display: flex; align-items: center; gap: 4px;">
                <span class="msg-time">${msg.time}</span>
                ${deleteBtnHTML}
              </div>
            </div>
            ${contentHTML}
          `;
        }
        container.appendChild(msgEl);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const text = msgInput.value.trim();

      if (!text) return;

      const newMsg = {
        userId: myUserId,
        author: myUsername,
        text: text,
        type: 'text',
        room: activeRoom === "global" ? "global" : "private",
        targetId: activeRoom !== "global" ? activeRoom : null,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      msgInput.value = "";
      renderUI();
      saveToCloud();
    }

    async function sendGif(gifUrl) {
      const newMsg = {
        userId: myUserId,
        author: myUsername,
        text: "Гифка",
        type: 'gif',
        gifUrl: gifUrl,
        room: activeRoom === "global" ? "global" : "private",
        targetId: activeRoom !== "global" ? activeRoom : null,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      renderUI();
      saveToCloud();
    }

    function deleteMsg(index) {
      allMessages.splice(index, 1);
      renderUI();
      saveToCloud();
    }

    async function saveToCloud() {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            messages: allMessages,
            users: usersData 
          })
        });
      } catch (err) {
        console.error("Ошибка сохранения:", err);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    /* --- ЛОГИКА ГОЛОСОВОЙ ЧАТ-РУЛЕТКИ --- */
    async function startRoulette() {
      document.getElementById("rouletteOverlay").classList.add("active");
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        startVisualizer();
        nextPartner();
      } catch (err) {
        document.getElementById("rouletteStatus").innerText = "Ошибка доступа к микрофону";
        document.getElementById("partnerName").innerText = "Разрешите доступ в браузере для работы голосовой рулетки.";
      }
    }

    function stopRoulette() {
      document.getElementById("rouletteOverlay").classList.remove("active");
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      clearInterval(visualizerInterval);
    }

    const fakePartners = [
      { name: "Собеседник из Москвы", avatar: "👨‍💻" },
      { name: "Собеседник из Красноярска", avatar: "🎧" },
      { name: "Собеседник из Питера", avatar: "🎸" },
      { name: "Анонимный Гость", avatar: "🕵️" },
      { name: "Собеседница Алена", avatar: "👩‍🎨" }
    ];

    function nextPartner() {
      document.getElementById("rouletteStatus").innerText = "Ищем свободного собеседника...";
      document.getElementById("partnerName").innerText = "Подождите пару секунд...";
      document.getElementById("partnerAvatar").innerText = "🔍";
      document.getElementById("pulseRing").style.display = "block";

      setTimeout(() => {
        const randomPartner = fakePartners[Math.floor(Math.random() * fakePartners.length)];
        document.getElementById("rouletteStatus").innerText = "Собеседник найден!";
        document.getElementById("partnerName").innerText = randomPartner.name + " (Онлайн)";
        document.getElementById("partnerAvatar").innerText = randomPartner.avatar;
      }, 2000);
    }

    function toggleMute() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks()[0].enabled = !isMuted;
      const muteBtn = document.getElementById("muteBtn");
      muteBtn.innerText = isMuted ? "🎙️ Микр. ВЫКЛ" : "🎙️ Микр. ВКЛ";
      muteBtn.style.background = isMuted ? "rgba(239, 68, 68, 0.3)" : "rgba(255, 255, 255, 0.1)";
    }

    function startVisualizer() {
      const bars = document.querySelectorAll(".bar");
      visualizerInterval = setInterval(() => {
        bars.forEach(bar => {
          const height = isMuted ? 4 : Math.floor(Math.random() * 26) + 4;
          bar.style.height = height + "px";
        });
      }, 120);
    }

    loadData();
    setInterval(loadData, 3000);
  </script>
