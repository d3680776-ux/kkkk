<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Общий Онлайн Чат</title>
  
  <!-- Подключаем Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .chat-header {
      background: #0f172a;
      padding: 16px 20px;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 18px;
      color: #38bdf8;
    }

    .status-badge {
      font-size: 11px;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-item {
      background: #334155;
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 85%;
      word-wrap: break-word;
      line-height: 1.4;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
      font-size: 11px;
    }

    .msg-author {
      font-weight: 700;
      color: #38bdf8;
    }

    .msg-time {
      color: #94a3b8;
    }

    .msg-text {
      font-size: 14px;
      color: #f1f5f9;
    }

    .chat-footer {
      padding: 14px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 10px;
    }

    input {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    #usernameInput {
      width: 130px;
    }

    #messageInput {
      flex: 1;
    }

    button {
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <h1>💬 Общий Онлайн Чат</h1>
      <span class="status-badge">Онлайн синк</span>
    </div>

    <div class="messages-box" id="msgContainer">
      <div class="msg-item" style="background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); align-self: center; text-align: center;">
        <div class="msg-text" style="color: #38bdf8; font-size: 12px;">Загрузка сообщений из облака...</div>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" id="usernameInput" placeholder="Имя" maxlength="15">
      <input type="text" id="messageInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">Отправить</button>
    </div>
  </div>

  <script>
    // Подключение к облачной базе данных
    const firebaseConfig = {
      databaseURL: "https://public-chat-demo-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref("global_messages");

    // Случайное имя при входе
    document.getElementById("usernameInput").value = "User_" + Math.floor(100 + Math.random() * 900);

    // Слушаем новые сообщения в реальном времени
    chatRef.limitToLast(50).on("child_added", (snapshot) => {
      const data = snapshot.val();
      appendMessageUI(data.author, data.text, data.time);
    });

    chatRef.once("value", () => {
      const container = document.getElementById("msgContainer");
      if (container.innerHTML.includes("Загрузка сообщений")) {
        container.innerHTML = "";
      }
    });

    function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const usernameInput = document.getElementById("usernameInput");
      
      const text = msgInput.value.trim();
      const author = usernameInput.value.trim() || "Аноним";

      if (!text) return;

      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Отправка в облако
      chatRef.push({
        author: author,
        text: text,
        time: timeStr
      });

      msgInput.value = "";
    }

    function appendMessageUI(author, text, time) {
      const container = document.getElementById("msgContainer");
      const msgEl = document.createElement("div");
      msgEl.className = "msg-item";

      msgEl.innerHTML = `
        <div class="msg-header">
          <span class="msg-author">${escapeHTML(author)}</span>
          <span class="msg-time">${time || ''}</span>
        </div>
        <div class="msg-text">${escapeHTML(text)}</div>
      `;

      container.appendChild(msgEl);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
