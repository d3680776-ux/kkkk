<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Web — Мессенджер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-sidebar: #ffffff;
      --bg-chat: #dfe7ef;
      --bg-header: #ffffff;
      --tg-blue: #3390ec;
      --tg-blue-dark: #2578cc;
      --bubble-out: #eeffde;
      --bubble-in: #ffffff;
      --text-main: #0f172a;
      --text-muted: #707579;
      --border: #e4e4e7;
    }
    body {
      margin: 0;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #cfd9e3;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .tg-window {
      width: 100%;
      max-width: 980px;
      height: 100vh;
      max-height: 760px;
      background: #ffffff;
      display: flex;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }
    @media (min-width: 768px) {
      .tg-window {
        height: 92vh;
        border-radius: 16px;
      }
    }
    /* Левая панель чатов */
    .sidebar {
      width: 310px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    @media (max-width: 720px) {
      .sidebar {
        display: none;
      }
      .sidebar.mobile-show {
        display: flex;
        width: 100%;
      }
      .chat-pane.mobile-hide {
        display: none;
      }
    }
    .side-top {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .menu-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--tg-blue);
      color: #fff;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .search-box {
      flex: 1;
      background: #f4f4f5;
      border: none;
      border-radius: 18px;
      padding: 8px 14px;
      font-size: 14px;
      outline: none;
      color: var(--text-main);
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .chat-item:hover {
      background: #f4f4f5;
    }
    .chat-item.active {
      background: var(--tg-blue);
      color: #ffffff;
    }
    .chat-item.active .chat-sub,
    .chat-item.active .chat-time {
      color: rgba(255, 255, 255, 0.85);
    }
    .ava {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .ava-saved { background: linear-gradient(135deg, #3390ec, #58b4ff); }
    .ava-general { background: linear-gradient(135deg, #10b981, #34d399); }
    .ava-bot { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }
    .chat-info {
      flex: 1;
      min-width: 0;
    }
    .chat-row1 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .chat-title {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-time {
      font-size: 11px;
      color: var(--text-muted);
    }
    .chat-sub {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .side-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Правая панель переписки */
    .chat-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #d7e4d6 0%, #c8dec9 50%, #d4e3ec 100%);
      position: relative;
    }
    .chat-header {
      height: 58px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .back-btn {
      display: none;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--tg-blue);
    }
    @media (max-width: 720px) {
      .back-btn { display: inline-block; }
    }
    .header-title {
      font-weight: 700;
      font-size: 15px;
    }
    .header-status {
      font-size: 12px;
      color: var(--tg-blue);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: #f4f4f5;
      border: none;
      border-radius: 10px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }
    .icon-btn:hover { background: #e4e4e7; }

    /* Имя пользователя плашка */
    .profile-strip {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(6px);
      padding: 7px 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .profile-strip input {
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 13px;
      width: 170px;
      outline: none;
    }
    .profile-strip input:focus {
      border-color: var(--tg-blue);
    }

    /* Сообщения */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .date-pill {
      align-self: center;
      background: rgba(15, 23, 42, 0.28);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin: 4px 0 8px;
    }
    .bubble {
      max-width: 76%;
      padding: 8px 12px 6px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.38;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      word-break: break-word;
      position: relative;
    }
    .bubble.in {
      align-self: flex-start;
      background: var(--bubble-in);
      border-bottom-left-radius: 4px;
    }
    .bubble.out {
      align-self: flex-end;
      background: var(--bubble-out);
      border-bottom-right-radius: 4px;
    }
    .bubble-author {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 2px;
    }
    .bubble-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }
    .bubble.out .bubble-meta {
      color: #4b8b3b;
    }

    /* Поле ввода снизу */
    .input-bar {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .msg-field {
      flex: 1;
      border: none;
      background: #f4f4f5;
      border-radius: 20px;
      padding: 11px 16px;
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
    }
    .send-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--tg-blue);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send-circle:hover { background: var(--tg-blue-dark); }
    .send-circle:active { transform: scale(0.95); }

    /* Модалка звонка */
    .call-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.72);
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .call-overlay.show { display: flex; }
    .call-card {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(160deg, #1e3a5f, #0f172a);
      color: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .call-ava {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--tg-blue);
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .hangup-btn {
      margin-top: 22px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tg-window">
    <!-- Левая панель чатов -->
    <div class="sidebar" id="sidebar">
      <div class="side-top">
        <div class="menu-badge">✈</div>
        <input class="search-box" id="searchInput" type="text" placeholder="Поиск чатов..." oninput="filterChats()" />
      </div>
      <div class="chat-list" id="chatList">
        <div class="chat-item active" data-chat="general" onclick="switchChat('general')">
          <div class="ava ava-general">💬</div>
          <div class="chat-info">
            <div class="chat-row1">
              <span class="chat-title">Общий чат</span>
              <span class="chat-time" id="time-general">сейчас</span>
            </div>
            <div class="chat-sub" id="preview-general">Переписка через npoint.io</div>
          </div>
        </div>

        <div class="chat-item" data-chat="saved" onclick="switchChat('saved')">
          <div class="ava ava-saved">🔖</div>
          <div class="chat-info">
            <div class="chat-row1">
              <span class="chat-title">Избранное</span>
              <span class="chat-time" id="time-saved">заметки</span>
            </div>
            <div class="chat-sub" id="preview-saved">Мои сохранённые сообщения</div>
          </div>
        </div>

        <div class="chat-item" data-chat="friends" onclick="switchChat('friends')">
          <div class="ava ava-bot">👥</div>
          <div class="chat-info">
            <div class="chat-row1">
              <span class="chat-title">Друзья и прогулки</span>
              <span class="chat-time" id="time-friends">чат</span>
            </div>
            <div class="chat-sub" id="preview-friends">Договориться погулять или поиграть</div>
          </div>
        </div>
      </div>
      <div class="side-footer">
        <span id="cloudStatus">Подключение...</span>
        <span id="visitorsCount">👀 0</span>
      </div>
    </div>

    <!-- Правая панель чата -->
    <div class="chat-pane" id="chatPane">
      <div class="chat-header">
        <div class="header-left">
          <button class="back-btn" onclick="toggleMobileSidebar()">☰</button>
          <div>
            <div class="header-title" id="activeChatTitle">Общий чат</div>
            <div class="header-status" id="activeChatSub">в сети • облако npoint.io</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" onclick="startCall()">📞 Звонок</button>
          <button class="icon-btn" style="color:#dc2626;" onclick="clearChat()">Очистить</button>
        </div>
      </div>

      <div class="profile-strip">
        <span>Твоё имя:</span>
        <input id="myName" type="text" placeholder="Дима" maxlength="24" onchange="saveName()" />
        <span style="color:#707579; margin-left:auto;" id="syncBadge">Синхронизация</span>
      </div>

      <div class="messages-area" id="messagesArea">
        <div class="date-pill">Сегодня</div>
      </div>

      <div class="input-bar">
        <input class="msg-field" id="msgInput" type="text" placeholder="Написать сообщение..." maxlength="400" onkeydown="if(event.key==='Enter') sendMessage()" />
        <button class="send-circle" onclick="sendMessage()" title="Отправить">➤</button>
      </div>
    </div>
  </div>

  <!-- Окно звонка -->
  <div class="call-overlay" id="callOverlay">
    <div class="call-card">
      <div class="call-ava">📞</div>
      <div style="font-size:20px; font-weight:800;" id="callTarget">Общий чат</div>
      <div style="font-size:13px; color:#93c5fd; margin-top:6px;" id="callTimer">Соединение...</div>
      <button class="hangup-btn" onclick="endCall()">Завершить</button>
    </div>
  </div>

  <script>
    // Твой exact endpoint с картинки: https://api.npoint.io/80185a88336abe28de83
    // Работает прямо с твоей структурой JSON: { "messages": [], "visitors": [] }
    const API_URL = "https://api.npoint.io/80185a88336abe28de83";
    const STORAGE_MSGS = "tg_clone_messages_v3";
    const STORAGE_NAME = "tg_clone_username_v3";
    const SESSION_VISIT = "tg_clone_visited_v3";

    const CHATS = {
      general: { title: "Общий чат", sub: "в сети • облако npoint.io" },
      saved: { title: "Избранное", sub: "облачные заметки и ссылки" },
      friends: { title: "Друзья и прогулки", sub: "чат для компании" }
    };

    let currentChat = "general";
    let allMessages = [];
    let allVisitors = [];
    let callInterval = null;

    // Если открыто внутри Telegram Mini App — подставляем имя из профиля
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try {
        tg.ready();
        tg.expand();
        const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
        if (u && u.first_name && !localStorage.getItem(STORAGE_NAME)) {
          localStorage.setItem(STORAGE_NAME, u.first_name);
        }
      } catch (_) {}
    }

    function getMyName() {
      const val = (document.getElementById("myName").value || "").trim();
      return val || "Дима";
    }

    function saveName() {
      const val = (document.getElementById("myName").value || "").trim();
      if (val) localStorage.setItem(STORAGE_NAME, val);
    }

    function formatTime() {
      return new Date().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatFullDate() {
      return new Date().toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function fetchBin() {
      try {
        const res = await fetch(`${API_URL}?_=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          const msgs = Array.isArray(data && data.messages) ? data.messages : [];
          const vis = Array.isArray(data && data.visitors) ? data.visitors : [];
          localStorage.setItem(STORAGE_MSGS, JSON.stringify(msgs));
          return { ok: true, messages: msgs, visitors: vis };
        }
      } catch (_) {}
      let cached = [];
      try {
        cached = JSON.parse(localStorage.getItem(STORAGE_MSGS) || "[]");
      } catch (_) {}
      return { ok: false, messages: cached, visitors: allVisitors };
    }

    async function pushBin(messages, visitors) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: messages,
          visitors: visitors
        })
      });
      return res.ok;
    }

    function updatePreviews() {
      ["general", "saved", "friends"].forEach((cid) => {
        const list = allMessages.filter((m) => (m.chat || "general") === cid);
        const prevEl = document.getElementById("preview-" + cid);
        const timeEl = document.getElementById("time-" + cid);
        if (list.length) {
          const last = list[list.length - 1];
          prevEl.textContent = `${last.author || "Я"}: ${last.text || ""}`;
          timeEl.textContent = last.time || "";
        }
      });
    }

    function renderMessages() {
      const area = document.getElementById("messagesArea");
      const myName = getMyName();
      const filtered = allMessages.filter((m) => (m.chat || "general") === currentChat);

      let html = '<div class="date-pill">Сегодня</div>';
      if (!filtered.length) {
        html += `<div class="bubble in"><div class="bubble-author">Telegram</div><div>Сообщений пока нет. Напиши первое сообщение в «${escapeHtml(CHATS[currentChat].title)}»!</div><div class="bubble-meta"><span>${formatTime()}</span></div></div>`;
      } else {
        html += filtered
          .map((m) => {
            const author = m.author || m.name || "Участник";
            const isMine = author.toLowerCase() === myName.toLowerCase() || currentChat === "saved";
            return `
              <div class="bubble ${isMine ? "out" : "in"}">
                ${!isMine ? `<div class="bubble-author">${escapeHtml(author)}</div>` : ""}
                <div>${escapeHtml(m.text || "")}</div>
                <div class="bubble-meta">
                  <span>${escapeHtml(m.time || "")}</span>
                  ${isMine ? "<span>✓✓</span>" : ""}
                </div>
              </div>
            `;
          })
          .join("");
      }

      const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;
      area.innerHTML = html;
      if (wasAtBottom) {
        area.scrollTop = area.scrollHeight;
      }

      document.getElementById("visitorsCount").textContent = `👀 ${allVisitors.length}`;
      updatePreviews();
    }

    async function sendMessage() {
      const input = document.getElementById("msgInput");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      saveName();
      const author = getMyName();
      const syncEl = document.getElementById("syncBadge");
      syncEl.textContent = "Отправка...";

      const msgObj = {
        id: Date.now(),
        chat: currentChat,
        author: author,
        text: text,
        time: formatTime(),
        date: formatFullDate()
      };

      const latest = await fetchBin();
      const updatedMsgs = [...latest.messages, msgObj].slice(-100);
      allMessages = updatedMsgs;
      allVisitors = latest.visitors;
      renderMessages();

      try {
        localStorage.setItem(STORAGE_MSGS, JSON.stringify(updatedMsgs));
      } catch (_) {}

      const ok = await pushBin(updatedMsgs, allVisitors);
      syncEl.textContent = ok ? "Сохранено ✓" : "Локально";
      document.getElementById("cloudStatus").textContent = ok ? "npoint.io онлайн ✓" : "Офлайн";
    }

    function switchChat(chatId) {
      currentChat = chatId;
      document.querySelectorAll(".chat-item").forEach((el) => {
        el.classList.toggle("active", el.dataset.chat === chatId);
      });
      document.getElementById("activeChatTitle").textContent = CHATS[chatId].title;
      document.getElementById("activeChatSub").textContent = CHATS[chatId].sub;

      const sb = document.getElementById("sidebar");
      const cp = document.getElementById("chatPane");
      sb.classList.remove("mobile-show");
      cp.classList.remove("mobile-hide");

      renderMessages();
      const area = document.getElementById("messagesArea");
      area.scrollTop = area.scrollHeight;
    }

    function toggleMobileSidebar() {
      const sb = document.getElementById("sidebar");
      const cp = document.getElementById("chatPane");
      sb.classList.toggle("mobile-show");
      cp.classList.toggle("mobile-hide");
    }

    function filterChats() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      document.querySelectorAll(".chat-item").forEach((el) => {
        const txt = el.textContent.toLowerCase();
        el.style.display = txt.includes(q) ? "flex" : "none";
      });
    }

    async function clearChat() {
      if (!confirm(`Очистить сообщения в «${CHATS[currentChat].title}»?`)) return;
      const latest = await fetchBin();
      const remaining = latest.messages.filter((m) => (m.chat || "general") !== currentChat);
      allMessages = remaining;
      allVisitors = latest.visitors;
      localStorage.setItem(STORAGE_MSGS, JSON.stringify(remaining));
      await pushBin(remaining, allVisitors);
      renderMessages();
    }

    function startCall() {
      document.getElementById("callTarget").textContent = CHATS[currentChat].title;
      const timerEl = document.getElementById("callTimer");
      timerEl.textContent = "Гудки...";
      document.getElementById("callOverlay").classList.add("show");
      let sec = 0;
      clearInterval(callInterval);
      callInterval = setInterval(() => {
        sec++;
        const m = String(Math.floor(sec / 60)).padStart(2, "0");
        const s = String(sec % 60).padStart(2, "0");
        timerEl.textContent = `В разговоре • ${m}:${s}`;
      }, 1000);
    }

    function endCall() {
      clearInterval(callInterval);
      document.getElementById("callOverlay").classList.remove("show");
    }

    async function init() {
      const savedName = localStorage.getItem(STORAGE_NAME);
      if (savedName) {
        document.getElementById("myName").value = savedName;
      }

      const data = await fetchBin();
      allMessages = data.messages;
      allVisitors = data.visitors;

      if (data.ok) {
        document.getElementById("cloudStatus").textContent = "npoint.io онлайн ✓";
        document.getElementById("syncBadge").textContent = "Облако ✓";

        if (!sessionStorage.getItem(SESSION_VISIT)) {
          sessionStorage.setItem(SESSION_VISIT, "1");
          const visitObj = {
            name: getMyName(),
            time: formatFullDate(),
            device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "Телефон" : "Ноутбук"
          };
          allVisitors = [visitObj, ...allVisitors].slice(0, 60);
          await pushBin(allMessages, allVisitors);
        }
      } else {
        document.getElementById("cloudStatus").textContent = "Офлайн-режим";
        document.getElementById("syncBadge").textContent = "Локально";
      }

      renderMessages();
      const area = document.getElementById("messagesArea");
      area.scrollTop = area.scrollHeight;
    }

    init();
    setInterval(async () => {
      const data = await fetchBin();
      if (data.ok) {
        allMessages = data.messages;
        allVisitors = data.visitors;
        renderMessages();
      }
    }, 4000);
  </script>
</body>
</html>
