<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram — Мессенджер и Звонки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --tg-blue: #3390ec;
      --tg-blue-dark: #2678cb;
      --tg-bg: #ffffff;
      --tg-chat-bg: #dce8d8;
      --tg-out: #eeffde;
      --tg-in: #ffffff;
      --tg-border: #e5e7eb;
      --tg-muted: #707579;
      --tg-text: #111827;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #cfd9e6;
      color: var(--tg-text);
    }
    .app-wrap {
      width: 100%;
      max-width: 960px;
      height: 100%;
      margin: 0 auto;
      background: var(--tg-bg);
      display: flex;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.16);
    }
    @media (min-width: 768px) {
      body { padding: 16px; }
      .app-wrap {
        height: calc(100vh - 32px);
        border-radius: 16px;
      }
    }

    /* Левая колонка: чаты */
    .sidebar {
      width: 300px;
      border-right: 1px solid var(--tg-border);
      display: flex;
      flex-direction: column;
      background: #ffffff;
      flex-shrink: 0;
    }
    .side-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--tg-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tg-logo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--tg-blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .search-input {
      flex: 1;
      background: #f3f4f6;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 14px;
      outline: none;
      color: var(--tg-text);
    }
    .search-input:focus {
      background: #fff;
      border-color: var(--tg-blue);
    }
    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .chat-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .chat-row:hover { background: #f3f4f6; }
    .chat-row.active {
      background: var(--tg-blue);
      color: #ffffff;
    }
    .chat-row.active .chat-preview,
    .chat-row.active .chat-date {
      color: rgba(255, 255, 255, 0.88);
    }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      color: #fff;
      flex-shrink: 0;
    }
    .av-1 { background: linear-gradient(135deg, #2aabee, #229ed9); }
    .av-2 { background: linear-gradient(135deg, #10b981, #059669); }
    .av-3 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .chat-meta {
      flex: 1;
      min-width: 0;
    }
    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .chat-name {
      font-weight: 700;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-date {
      font-size: 11px;
      color: var(--tg-muted);
    }
    .chat-preview {
      font-size: 13px;
      color: var(--tg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
    }
    .side-bottom {
      padding: 10px 14px;
      border-top: 1px solid var(--tg-border);
      font-size: 12px;
      color: var(--tg-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Правая колонка: диалог */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: linear-gradient(180deg, #d6e5d1 0%, #c8dec9 55%, #d5e4ed 100%);
      position: relative;
    }
    .chat-topbar {
      height: 58px;
      background: #ffffff;
      border-bottom: 1px solid var(--tg-border);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mobile-menu-btn {
      display: none;
      background: #f3f4f6;
      border: none;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
    }
    .room-title {
      font-weight: 700;
      font-size: 15.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .room-sub {
      font-size: 12px;
      color: var(--tg-blue);
    }
    .top-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-btn {
      background: #f3f4f6;
      border: none;
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--tg-text);
    }
    .top-btn:hover { background: #e5e7eb; }

    .name-bar {
      background: rgba(255, 255, 255, 0.92);
      padding: 7px 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      flex-shrink: 0;
    }
    .name-input {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 13.5px;
      width: 165px;
      outline: none;
      background: #fff;
      color: var(--tg-text);
    }
    .name-input:focus { border-color: var(--tg-blue); }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .day-badge {
      align-self: center;
      background: rgba(17, 24, 39, 0.3);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin: 2px 0 6px;
    }
    .msg-bubble {
      max-width: 78%;
      padding: 8px 12px 6px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.38;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      word-break: break-word;
    }
    .msg-bubble.in {
      align-self: flex-start;
      background: var(--tg-in);
      border-bottom-left-radius: 4px;
    }
    .msg-bubble.out {
      align-self: flex-end;
      background: var(--tg-out);
      border-bottom-right-radius: 4px;
    }
    .msg-sender {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 2px;
    }
    .msg-foot {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #6b7280;
      margin-top: 3px;
    }
    .msg-bubble.out .msg-foot { color: #4d8b3c; }

    /* Нижняя панель ввода — всегда активна и поверх всего */
    .composer-form {
      background: #ffffff;
      border-top: 1px solid var(--tg-border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .composer-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      background: #f9fafb;
      border-radius: 22px;
      padding: 11px 16px;
      font-size: 15px;
      font-family: inherit;
      color: #111827;
      outline: none;
      min-width: 0;
    }
    .composer-input:focus {
      background: #ffffff;
      border-color: var(--tg-blue);
    }
    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--tg-blue);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--tg-blue-dark); }
    .send-btn:active { transform: scale(0.95); }

    @media (max-width: 720px) {
      .mobile-menu-btn { display: inline-flex; align-items: center; justify-content: center; }
      .sidebar {
        position: fixed;
        inset: 0;
        width: 100%;
        z-index: 30;
        display: none;
      }
      .sidebar.open { display: flex; }
    }

    /* Модалка звонка */
    .call-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .call-modal.open { display: flex; }
    .call-box {
      width: 100%;
      max-width: 330px;
      background: linear-gradient(160deg, #1d3b5c, #0f172a);
      color: #fff;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
    }
    .call-circle {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--tg-blue);
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }
    .end-call-btn {
      margin-top: 20px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <!-- Список чатов -->
    <aside class="sidebar" id="sidebar">
      <div class="side-header">
        <div class="tg-logo">✈</div>
        <input class="search-input" id="searchBox" type="text" placeholder="Поиск" oninput="filterChatList()" />
      </div>
      <div class="chat-list" id="chatList">
        <div class="chat-row active" data-room="general" onclick="selectRoom('general')">
          <div class="avatar av-1">💬</div>
          <div class="chat-meta">
            <div class="chat-top">
              <span class="chat-name">Общий чат</span>
              <span class="chat-date" id="date-general">сейчас</span>
            </div>
            <div class="chat-preview" id="prev-general">Облако npoint.io подключено</div>
          </div>
        </div>

        <div class="chat-row" data-room="saved" onclick="selectRoom('saved')">
          <div class="avatar av-2">🔖</div>
          <div class="chat-meta">
            <div class="chat-top">
              <span class="chat-name">Избранное</span>
              <span class="chat-date" id="date-saved">заметки</span>
            </div>
            <div class="chat-preview" id="prev-saved">Сохранённые сообщения</div>
          </div>
        </div>

        <div class="chat-row" data-room="friends" onclick="selectRoom('friends')">
          <div class="avatar av-3">👥</div>
          <div class="chat-meta">
            <div class="chat-top">
              <span class="chat-name">Друзья</span>
              <span class="chat-date" id="date-friends">чат</span>
            </div>
            <div class="chat-preview" id="prev-friends">Погулять и поиграть</div>
          </div>
        </div>
      </div>
      <div class="side-bottom">
        <span id="netStatus">Подключение...</span>
        <span id="visitorsPill">👀 0</span>
      </div>
    </aside>

    <!-- Окно переписки -->
    <main class="main-chat">
      <header class="chat-topbar">
        <div class="top-left">
          <button type="button" class="mobile-menu-btn" onclick="toggleDrawer()">☰</button>
          <div>
            <div class="room-title" id="roomTitle">Общий чат</div>
            <div class="room-sub" id="roomSub">в сети • npoint.io</div>
          </div>
        </div>
        <div class="top-btns">
          <button type="button" class="top-btn" onclick="openCall()">📞 Звонок</button>
          <button type="button" class="top-btn" style="color:#dc2626;" onclick="clearRoom()">Очистить</button>
        </div>
      </header>

      <div class="name-bar">
        <span>Имя:</span>
        <input class="name-input" id="userNameInput" type="text" placeholder="Дима" maxlength="24" onchange="persistName()" />
        <span id="saveState" style="margin-left:auto; color:#707579;">Готово</span>
      </div>

      <div class="messages-box" id="messagesBox">
        <div class="day-badge">Сегодня</div>
      </div>

      <form class="composer-form" id="composerForm" onsubmit="return handleFormSubmit(event)">
        <input
          class="composer-input"
          id="messageField"
          type="text"
          autocomplete="off"
          placeholder="Написать сообщение..."
          maxlength="500"
        />
        <button type="submit" class="send-btn" title="Отправить">➤</button>
      </form>
    </main>
  </div>

  <!-- Окно звонка -->
  <div class="call-modal" id="callModal">
    <div class="call-box">
      <div class="call-circle">📞</div>
      <div style="font-size:20px; font-weight:800;" id="callName">Общий чат</div>
      <div style="font-size:13px; color:#93c5fd; margin-top:6px;" id="callStatus">Вызов...</div>
      <button type="button" class="end-call-btn" onclick="closeCall()">Сбросить</button>
    </div>
  </div>

  <script>
    // Твой exact бин со скриншота: https://api.npoint.io/80185a88336abe28de83
    // Работает прямо с твоим JSON: { "messages": [], "visitors": [] }
    const API_URL = "https://api.npoint.io/80185a88336abe28de83";
    const LS_MSGS = "tg_web_msgs_v4";
    const LS_NAME = "tg_web_name_v4";
    const SS_VISIT = "tg_web_visit_v4";

    const ROOMS = {
      general: { title: "Общий чат", sub: "в сети • npoint.io" },
      saved: { title: "Избранное", sub: "личные облачные заметки" },
      friends: { title: "Друзья", sub: "чат компании" }
    };

    let activeRoom = "general";
    let messagesList = [];
    let visitorsList = [];
    let callTimerId = null;

    const tgApp = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tgApp) {
      try {
        tgApp.ready();
        tgApp.expand();
        const u = tgApp.initDataUnsafe && tgApp.initDataUnsafe.user;
        if (u && u.first_name && !localStorage.getItem(LS_NAME)) {
          localStorage.setItem(LS_NAME, u.first_name);
        }
      } catch (_) {}
    }

    function currentUser() {
      const v = (document.getElementById("userNameInput").value || "").trim();
      return v || "Дима";
    }

    function persistName() {
      const v = (document.getElementById("userNameInput").value || "").trim();
      if (v) localStorage.setItem(LS_NAME, v);
    }

    function getTimeHM() {
      return new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }

    function getDateTime() {
      return new Date().toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function loadCloud() {
      try {
        const r = await fetch(`${API_URL}?_=${Date.now()}`);
        if (r.ok) {
          const j = await r.json();
          const msgs = Array.isArray(j && j.messages) ? j.messages : [];
          const vis = Array.isArray(j && j.visitors) ? j.visitors : [];
          try {
            localStorage.setItem(LS_MSGS, JSON.stringify(msgs));
          } catch (_) {}
          return { ok: true, messages: msgs, visitors: vis };
        }
      } catch (_) {}
      let local = [];
      try {
        local = JSON.parse(localStorage.getItem(LS_MSGS) || "[]");
      } catch (_) {}
      return { ok: false, messages: local, visitors: visitorsList };
    }

    async function saveCloud(msgs, vis) {
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: msgs, visitors: vis })
        });
        return r.ok;
      } catch (_) {
        return false;
      }
    }

    function drawMessages(scrollBottom) {
      const box = document.getElementById("messagesBox");
      const me = currentUser();
      const roomMsgs = messagesList.filter((m) => (m.room || m.chat || "general") === activeRoom);

      let out = '<div class="day-badge">Сегодня</div>';
      if (!roomMsgs.length) {
        out += `<div class="msg-bubble in"><div class="msg-sender">Telegram</div><div>Напиши первое сообщение в «${esc(ROOMS[activeRoom].title)}» снизу!</div><div class="msg-foot"><span>${getTimeHM()}</span></div></div>`;
      } else {
        out += roomMsgs
          .map((m) => {
            const sender = m.author || m.name || "Участник";
            const mine = sender.toLowerCase() === me.toLowerCase() || activeRoom === "saved";
            return `
              <div class="msg-bubble ${mine ? "out" : "in"}">
                ${!mine ? `<div class="msg-sender">${esc(sender)}</div>` : ""}
                <div>${esc(m.text || "")}</div>
                <div class="msg-foot">
                  <span>${esc(m.time || "")}</span>
                  ${mine ? "<span>✓✓</span>" : ""}
                </div>
              </div>
            `;
          })
          .join("");
      }

      box.innerHTML = out;
      if (scrollBottom) {
        box.scrollTop = box.scrollHeight;
      }

      document.getElementById("visitorsPill").textContent = `👀 ${visitorsList.length}`;
      ["general", "saved", "friends"].forEach((rid) => {
        const list = messagesList.filter((m) => (m.room || m.chat || "general") === rid);
        if (list.length) {
          const last = list[list.length - 1];
          document.getElementById("prev-" + rid).textContent = `${last.author || "Я"}: ${last.text || ""}`;
          document.getElementById("date-" + rid).textContent = last.time || "";
        }
      });
    }

    function handleFormSubmit(e) {
      if (e) e.preventDefault();
      const field = document.getElementById("messageField");
      const text = field.value.trim();
      if (!text) return false;

      // Сразу очищаем поле и фокусируем его обратно, чтобы можно было писать дальше без задержек
      field.value = "";
      field.focus();
      persistName();

      const item = {
        id: Date.now(),
        room: activeRoom,
        author: currentUser(),
        text: text,
        time: getTimeHM(),
        date: getDateTime()
      };

      // Мгновенно добавляем в интерфейс
      messagesList = [...messagesList, item].slice(-120);
      try {
        localStorage.setItem(LS_MSGS, JSON.stringify(messagesList));
      } catch (_) {}
      drawMessages(true);

      // В фоне отправляем в npoint.io
      const stateEl = document.getElementById("saveState");
      stateEl.textContent = "Отправка...";
      loadCloud().then((fresh) => {
        const merged = fresh.ok
          ? [...fresh.messages.filter((m) => m.id !== item.id), item].slice(-120)
          : messagesList;
        messagesList = merged;
        visitorsList = fresh.visitors;
        return saveCloud(merged, visitorsList);
      }).then((ok) => {
        stateEl.textContent = ok ? "В облаке ✓" : "Локально";
        document.getElementById("netStatus").textContent = ok ? "npoint.io онлайн ✓" : "Офлайн";
      });

      return false;
    }

    function selectRoom(rid) {
      activeRoom = rid;
      document.querySelectorAll(".chat-row").forEach((el) => {
        el.classList.toggle("active", el.dataset.room === rid);
      });
      document.getElementById("roomTitle").textContent = ROOMS[rid].title;
      document.getElementById("roomSub").textContent = ROOMS[rid].sub;
      document.getElementById("sidebar").classList.remove("open");
      drawMessages(true);
      document.getElementById("messageField").focus();
    }

    function toggleDrawer() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    function filterChatList() {
      const q = document.getElementById("searchBox").value.trim().toLowerCase();
      document.querySelectorAll(".chat-row").forEach((el) => {
        el.style.display = el.textContent.toLowerCase().includes(q) ? "flex" : "none";
      });
    }

    async function clearRoom() {
      if (!confirm(`Очистить переписку в «${ROOMS[activeRoom].title}»?`)) return;
      const fresh = await loadCloud();
      const rest = fresh.messages.filter((m) => (m.room || m.chat || "general") !== activeRoom);
      messagesList = rest;
      visitorsList = fresh.visitors;
      try {
        localStorage.setItem(LS_MSGS, JSON.stringify(rest));
      } catch (_) {}
      drawMessages(true);
      await saveCloud(rest, visitorsList);
    }

    function openCall() {
      document.getElementById("callName").textContent = ROOMS[activeRoom].title;
      const st = document.getElementById("callStatus");
      st.textContent = "Соединение...";
      document.getElementById("callModal").classList.add("open");
      let s = 0;
      clearInterval(callTimerId);
      callTimerId = setInterval(() => {
        s++;
        const mm = String(Math.floor(s / 60)).padStart(2, "0");
        const ss = String(s % 60).padStart(2, "0");
        st.textContent = `Разговор • ${mm}:${ss}`;
      }, 1000);
    }

    function closeCall() {
      clearInterval(callTimerId);
      document.getElementById("callModal").classList.remove("open");
    }

    async function startApp() {
      const saved = localStorage.getItem(LS_NAME);
      if (saved) document.getElementById("userNameInput").value = saved;

      const res = await loadCloud();
      messagesList = res.messages;
      visitorsList = res.visitors;

      if (res.ok) {
        document.getElementById("netStatus").textContent = "npoint.io онлайн ✓";
        document.getElementById("saveState").textContent = "Облако ✓";
        if (!sessionStorage.getItem(SS_VISIT)) {
          sessionStorage.setItem(SS_VISIT, "1");
          visitorsList = [
            {
              name: currentUser(),
              time: getDateTime(),
              device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? "Телефон" : "Ноутбук"
            },
            ...visitorsList
          ].slice(0, 60);
          await saveCloud(messagesList, visitorsList);
        }
      } else {
        document.getElementById("netStatus").textContent = "Офлайн-режим";
        document.getElementById("saveState").textContent = "Локально";
      }

      drawMessages(true);
    }

    startApp();
    setInterval(async () => {
      const res = await loadCloud();
      if (res.ok) {
        messagesList = res.messages;
        visitorsList = res.visitors;
        drawMessages(false);
      }
    }, 4000);
  </script>
</body>
</html>
