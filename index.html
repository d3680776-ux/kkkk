<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PixelStudio Pro — Онлайн Редактор Фото</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.9);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger-color: #ef4444;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, var(--bg-color) 100%);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель меню */
    .editor-header {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
      color: #ffffff;
      border: none;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Рабочая область */
    .editor-workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Боковая панель инструментов */
    .sidebar {
      width: 220px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex-shrink: 0;
      overflow-y: auto;
    }

    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tool-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Холст для редактирования */
    .canvas-container {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: auto;
      padding: 20px;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: var(--shadow);
      background: #ffffff;
    }

    .placeholder-text {
      position: absolute;
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }

    /* Скрытый инпут файла */
    #fileInput {
      display: none;
    }

    @media (max-width: 650px) {
      .sidebar {
        width: 160px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Верхнее меню -->
  <header class="editor-header">
    <div class="logo">
      🎨 PixelStudio Pro
    </div>
    <div class="header-actions">
      <input type="file" id="fileInput" accept="image/*" onchange="loadImage(event)">
      <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
        📁 Открыть фото
      </button>
      <button class="btn" onclick="saveImage()">
        💾 Сохранить
      </button>
    </div>
  </header>

  <!-- Основная рабочая зона -->
  <div class="editor-workspace">
    <!-- Инструменты -->
    <aside class="sidebar">
      <div class="tool-group">
        <span class="tool-group-title">Фильтры</span>
        <button class="btn" onclick="applyFilter('grayscale')">⚫ Чёрно-белое</button>
        <button class="btn" onclick="applyFilter('invert')">🔄 Инверсия</button>
        <button class="btn" onclick="applyFilter('blur')">🌫 Размытие</button>
      </div>

      <div class="tool-group">
        <span class="tool-group-title">Правка</span>
        <button class="btn" onclick="rotateImage()">🔃 Поворот 90°</button>
        <button class="btn" onclick="resetImage()">↩ Сбросить</button>
      </div>

      <div class="tool-group">
        <span class="tool-group-title">Эффекты</span>
        <button class="btn" onclick="addWatermark()">✍ Штамп / Подпись</button>
      </div>
    </aside>

    <!-- Область холста -->
    <div class="canvas-container" id="canvasContainer">
      <div class="placeholder-text" id="placeholder">
        Загрузите изображение через кнопку «Открыть фото» вверху
      </div>
      <canvas id="imageCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    
    let img = new Image();
    let originalDataUrl = "";

    function loadImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        originalDataUrl = e.target.result;
        img.src = originalDataUrl;
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          placeholder.style.display = 'none';
        }
      }
      reader.readAsDataURL(file);
    }

    function applyFilter(type) {
      if (!img.src) return;
      ctx.drawImage(img, 0, 0);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      if (type === 'grayscale') {
        for (let i = 0; i < data.length; i += 4) {
          let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          data[i] = avg; data[i + 1] = avg; data[i + 2] = avg;
        }
      } else if (type === 'invert') {
        for (let i = 0; i < data.length; i += 4) {
          data[i] = 255 - data[i];
          data[i + 1] = 255 - data[i + 1];
          data[i + 2] = 255 - data[i + 2];
        }
      } else if (type === 'blur') {
        ctx.filter = 'blur(5px)';
        ctx.drawImage(img, 0, 0);
        ctx.filter = 'none';
        return;
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function rotateImage() {
      if (!img.src) return;
      let tempW = canvas.width;
      canvas.width = canvas.height;
      canvas.height = tempW;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();
    }

    function addWatermark() {
      if (!img.src) return;
      ctx.font = "24px Arial";
      ctx.fillStyle = "rgba(56, 189, 248, 0.8)";
      ctx.fillText("PixelStudio Pro", 20, canvas.height - 30);
    }

    function resetImage() {
      if (!originalDataUrl) return;
      img.src = originalDataUrl;
      img.onload = function() {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
      }
    }

    function saveImage() {
      if (!img.src) {
        alert("Сначала загрузите изображение!");
        return;
      }
      const link = document.createElement('a');
      link.download = 'edited-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
