<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Мессенджер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      height: 100vh;
      height: 100dvh; /* Корректная высота для мобильных браузеров */
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      overflow: hidden;
    }

    .chat-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 550px;
      height: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                  0 0 30px rgba(56, 189, 248, 0.15);
    }

    .chat-header {
      background: rgba(15, 23, 42, 0.95);
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 16px;
      color: #38bdf8;
      font-weight: 700;
    }

    .header-stats {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .call-btn {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .messages-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch; /* Плавный скролл на iOS и Android */
    }

    .msg-item {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .msg-item.theirs {
      background: #334155;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg-item.mine {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      font-size: 10px;
      opacity: 0.85;
    }

    .msg-author {
      font-weight: 700;
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 12px;
      padding: 0 2px;
    }

    .delete-btn:hover {
      color: #f87171;
    }

    .msg-text {
      font-size: 13px;
      line-height: 1.4;
    }

    .msg-text img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 6px;
      display: block;
    }

    .picker-panel {
      background: rgba(15, 23, 42, 0.95);
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .picker-btn {
      background: rgba(255, 255, 255, 0.07);
      border: none;
      border-radius: 8px;
      padding: 5px 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .chat-footer {
      padding: 12px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    input {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
    }

    #usernameInput {
      width: 90px;
    }

    #messageInput {
      flex: 1;
    }

    button.send-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <div class="header-info">
        <h1>💬 Мессенджер</h1>
        <div class="header-stats" id="statsText">Участников: 0</div>
      </div>
      <div class="header-actions">
        <a href="https://meet.jit.si/3d-messenger-room-shushenskoe" target="_blank" class="call-btn">
          📹 Видео
        </a>
      </div>
    </div>

    <div class="messages-box" id="msgContainer">
      <div style="color: #64748b; text-align: center; margin: auto;">Загрузка чата...</div>
    </div>

    <div class="picker-panel">
      <button class="picker-btn" onclick="addEmoji('👍')">👍</button>
      <button class="picker-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="picker-btn" onclick="addEmoji('😂')">😂</button>
      <button class="picker-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="picker-btn" onclick="addEmoji('😎')">😎</button>
      <button class="picker-btn" onclick="addEmoji('🎉')">🎉</button>
      <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif')">🔥 Огонь GIF</button>
      <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/LmNwrBhejkK9EFP504/giphy.gif')">🐱 Котик GIF</button>
    </div>

    <div class="chat-footer">
      <input type="text" id="usernameInput" placeholder="Имя" maxlength="15">
      <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <script>
    const BIN_ID = "fb49ce2087440a661a3d"; 
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    let myUserId = localStorage.getItem("chat_user_id");
    if (!myUserId) {
      myUserId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("chat_user_id", myUserId);
    }

    let allMessages = [];
    let visitorsList = [];

    document.getElementById("usernameInput").value = "Игрок_" + Math.floor(100 + Math.random() * 900);

    function addEmoji(emoji) {
      const input = document.getElementById("messageInput");
      input.value += emoji;
      input.focus();
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        const data = await response.json();
        
        allMessages = data.messages || [];
        visitorsList = data.visitors || [];

        if (!visitorsList.includes(myUserId)) {
          visitorsList.push(myUserId);
          saveToCloud();
        }

        renderUI();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function renderUI() {
      document.getElementById("statsText").innerText = `Заходило: ${visitorsList.length}`;

      const container = document.getElementById("msgContainer");
      if (allMessages.length === 0) {
        container.innerHTML = '<div style="color: #64748b; text-align: center; margin: auto;">Сообщений пока нет. Напишите первым!</div>';
        return;
      }

      container.innerHTML = "";
      allMessages.forEach((msg, index) => {
      const msgEl = document.createElement("div");
        const isMine = msg.userId === myUserId;
        msgEl.className = `msg-item ${isMine ? 'mine' : 'theirs'}`;

        let contentHTML = `<div class="msg-text">${escapeHTML(msg.text)}</div>`;
        if (msg.type === 'gif' && msg.gifUrl) {
          contentHTML = `<div class="msg-text"><img src="${escapeHTML(msg.gifUrl)}" alt="GIF"></div>`;
        }

        let deleteBtnHTML = '';
        if (isMine) {
          deleteBtnHTML = `<button class="delete-btn" onclick="deleteMsg(${index})">✕</button>`;
        }

        msgEl.innerHTML = `
          <div class="msg-header">
            <span class="msg-author">${escapeHTML(msg.author)}</span>
            <div style="display: flex; align-items: center; gap: 4px;">
              <span class="msg-time">${msg.time}</span>
              ${deleteBtnHTML}
            </div>
          </div>
          ${contentHTML}
        `;
        container.appendChild(msgEl);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const usernameInput = document.getElementById("usernameInput");

      const text = msgInput.value.trim();
      const author = usernameInput.value.trim() || "Аноним";

      if (!text) return;

      const newMsg = {
        userId: myUserId,
        author: author,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      msgInput.value = "";
      renderUI();
      saveToCloud();
    }

    async function sendGif(gifUrl) {
      const usernameInput = document.getElementById("usernameInput");
      const author = usernameInput.value.trim() || "Аноним";

      const newMsg = {
        userId: myUserId,
        author: author,
        text: "Гифка",
        type: 'gif',
        gifUrl: gifUrl,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      renderUI();
      saveToCloud();
    }

    function deleteMsg(index) {
      allMessages.splice(index, 1);
      renderUI();
      saveToCloud();
    }

    async function saveToCloud() {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            messages: allMessages,
            visitors: visitorsList 
          })
        });
      } catch (err) {
        console.error("Ошибка сохранения:", err);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    loadData();
    setInterval(loadData, 3000);
  </script>
</body>
</html>
