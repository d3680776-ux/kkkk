<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Онлайн Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      perspective: 1000px;
    }

    .chat-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 550px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                  0 0 30px rgba(56, 189, 248, 0.15);
      transform: rotateX(1deg);
      transition: transform 0.3s ease;
    }

    .chat-card:hover {
      transform: rotateX(0deg) scale(1.005);
    }

    .chat-header {
      background: rgba(15, 23, 42, 0.8);
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-info h1 {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-stats {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .status-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
      padding: 4px 10px;
      border-radius: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    .messages-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .msg-item {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      position: relative;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-item.theirs {
      background: #334155;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg-item.mine {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 4px;
      font-size: 11px;
      opacity: 0.8;
    }

    .msg-author {
      font-weight: 700;
    }

    .msg-text {
      font-size: 14px;
      line-height: 1.4;
    }

    .msg-text img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 6px;
      display: block;
    }

    .picker-panel {
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      overflow-x: auto;
    }

    .picker-btn {
      background: rgba(255, 255, 255, 0.07);
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .picker-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      transform: scale(1.1);
    }

    .chat-footer {
      padding: 16px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: white;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    #usernameInput {
      width: 110px;
    }

    #messageInput {
      flex: 1;
    }

    button.send-btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transition: transform 0.1s, box-shadow 0.2s;
    }

    button.send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <div class="header-info">
        <h1>💬 3D Мессенджер</h1>
        <div class="header-stats" id="statsText">Участников: 0</div>
      </div>
      <div class="status-container">
        <div class="status-dot"></div>
        <span>Онлайн</span>
      </div>
    </div>

    <div class="messages-box" id="msgContainer">
      <div style="color: #64748b; text-align: center; margin: auto;">Загрузка чата...</div>
    </div>

    <div class="picker-panel">
      <button class="picker-btn" onclick="addEmoji('👍')">👍</button>
      <button class="picker-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="picker-btn" onclick="addEmoji('😂')">😂</button>
      <button class="picker-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="picker-btn" onclick="addEmoji('😎')">😎</button>
      <button class="picker-btn" onclick="addEmoji('🎉')">🎉</button>
      <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif')">🔥 GIF</button>
      <button class="picker-btn" onclick="sendGif('https://media.giphy.com/media/LmNwrBhejkK9EFP504/giphy.gif')">🐱 GIF</button>
    </div>

    <div class="chat-footer">
      <input type="text" id="usernameInput" placeholder="Имя" maxlength="15">
      <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <script>
    const BIN_ID = "fb49ce2087440a661a3d"; 
    const API_URL = `https://api.npoint.io/${BIN_ID}`;

    let myUserId = localStorage.getItem("chat_user_id");
    if (!myUserId) {
      myUserId = "user_" + Math.random().toString(36).substring(2, 9);
      localStorage.setItem("chat_user_id", myUserId);
    }

    let allMessages = [];
    let visitorsList = [];

    document.getElementById("usernameInput").value = "Игрок_" + Math.floor(100 + Math.random() * 900);

    function addEmoji(emoji) {
      const input = document.getElementById("messageInput");
      input.value += emoji;
      input.focus();
    }

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?t=" + Date.now());
        const data = await response.json();
        
        allMessages = data.messages || [];
        visitorsList = data.visitors || [];

        // Регистрируем текущего пользователя как посетителя, если его еще нет в базе
        if (!visitorsList.includes(myUserId)) {
          visitorsList.push(myUserId);
          saveToCloud(); // отправляем обновленный список посетителей
        }

        renderUI();
      } catch (err) {
        console.error("Ошибка загрузки:", err);
      }
    }

    function renderUI() {
      // Обновляем счетчик зашедших людей
    document.getElementById("statsText").innerText = `Всего заходило: ${visitorsList.length}`;

      const container = document.getElementById("msgContainer");
      if (allMessages.length === 0) {
        container.innerHTML = '<div style="color: #64748b; text-align: center; margin: auto;">Сообщений пока нет. Напишите первым!</div>';
        return;
      }

      container.innerHTML = "";
      allMessages.forEach(msg => {
        const msgEl = document.createElement("div");
        const isMine = msg.userId === myUserId;
        msgEl.className = `msg-item ${isMine ? 'mine' : 'theirs'}`;

        let contentHTML = `<div class="msg-text">${escapeHTML(msg.text)}</div>`;
        if (msg.type === 'gif' && msg.gifUrl) {
          contentHTML = `<div class="msg-text"><img src="${escapeHTML(msg.gifUrl)}" alt="GIF"></div>`;
        }

        msgEl.innerHTML = `
          <div class="msg-header">
            <span class="msg-author">${escapeHTML(msg.author)}</span>
            <span class="msg-time">${msg.time}</span>
          </div>
          ${contentHTML}
        `;
        container.appendChild(msgEl);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMsg() {
      const msgInput = document.getElementById("messageInput");
      const usernameInput = document.getElementById("usernameInput");

      const text = msgInput.value.trim();
      const author = usernameInput.value.trim() || "Аноним";

      if (!text) return;

      const newMsg = {
        userId: myUserId,
        author: author,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      msgInput.value = "";
      renderUI();
      saveToCloud();
    }

    async function sendGif(gifUrl) {
      const usernameInput = document.getElementById("usernameInput");
      const author = usernameInput.value.trim() || "Аноним";

      const newMsg = {
        userId: myUserId,
        author: author,
        text: "Гифка",
        type: 'gif',
        gifUrl: gifUrl,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      allMessages.push(newMsg);
      renderUI();
      saveToCloud();
    }

    async function saveToCloud() {
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            messages: allMessages,
            visitors: visitorsList 
          })
        });
      } catch (err) {
        console.error("Ошибка сохранения:", err);
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }

    loadData();
    setInterval(loadData, 3000);
  </script>
</body>
</html>
